// ==================== UTILITY FUNCTIONS ====================

let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playSound(type) {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    const t = ctx.currentTime;
    switch(type) {
      case 'click':
        osc.frequency.setValueAtTime(800, t);
        osc.frequency.exponentialRampToValueAtTime(600, t+0.05);
        gain.gain.setValueAtTime(0.15, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t+0.08);
        osc.start(t); osc.stop(t+0.08); break;
      case 'correct':
        osc.frequency.setValueAtTime(523, t);
        osc.frequency.setValueAtTime(659, t+0.1);
        osc.frequency.setValueAtTime(784, t+0.2);
        gain.gain.setValueAtTime(0.2, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t+0.4);
        osc.start(t); osc.stop(t+0.4); break;
      case 'wrong':
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, t);
        osc.frequency.exponentialRampToValueAtTime(100, t+0.3);
        gain.gain.setValueAtTime(0.1, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t+0.3);
        osc.start(t); osc.stop(t+0.3); break;
      case 'flip':
        osc.frequency.setValueAtTime(1200, t);
        osc.frequency.exponentialRampToValueAtTime(800, t+0.06);
        gain.gain.setValueAtTime(0.1, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t+0.08);
        osc.start(t); osc.stop(t+0.08); break;
      case 'page':
        osc.frequency.setValueAtTime(600, t);
        osc.frequency.setValueAtTime(900, t+0.05);
        gain.gain.setValueAtTime(0.12, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t+0.1);
        osc.start(t); osc.stop(t+0.1); break;
      case 'star':
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, t);
        osc.frequency.setValueAtTime(1100, t+0.08);
        osc.frequency.setValueAtTime(1320, t+0.16);
        gain.gain.setValueAtTime(0.18, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t+0.35);
        osc.start(t); osc.stop(t+0.35); break;
      case 'celebrate':
        [523,659,784,1047].forEach((f,i) => {
          const o = ctx.createOscillator(); const g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.frequency.setValueAtTime(f, t+i*0.12);
          g.gain.setValueAtTime(0.15, t+i*0.12);
          g.gain.exponentialRampToValueAtTime(0.001, t+i*0.12+0.2);
          o.start(t+i*0.12); o.stop(t+i*0.12+0.2);
        });
        return;
    }
  } catch(e) {}
}

function speak(text, lang) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang === 'en' ? 'en-US' : 'zh-CN';
  u.rate = 0.8; u.pitch = 1.1;
  speechSynthesis.speak(u);
}

function showToast(msg, dur) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur || 2000);
}

function getState() {
  try {
    const s = JSON.parse(localStorage.getItem('starLearn'));
    return s ? {...DEFAULT_STATE, ...s} : {...DEFAULT_STATE};
  } catch(e) { return {...DEFAULT_STATE}; }
}

function saveState(s) {
  localStorage.setItem('starLearn', JSON.stringify(s));
}

function checkBadges() {
  const s = getState();
  let newBadge = false;
  BADGES.forEach(b => {
    if (s.stars >= b.stars && !s.badges.includes(b.id)) {
      s.badges.push(b.id);
      newBadge = true;
      showToast(`恭喜获得勋章：${b.name}！`);
    }
  });
  if (newBadge) saveState(s);
}

// ==================== APP NAVIGATION ====================

let currentTab = 'home';
let subPageStack = [];

function switchTab(tab) {
  playSound('click');
  currentTab = tab;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + tab).classList.add('active');
  document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab-item[data-tab="${tab}"]`).classList.add('active');
  renderPage(tab);
}

function openSubPage(id, html, opts) {
  opts = opts || {};
  const container = document.getElementById('subPages');
  const div = document.createElement('div');
  div.className = 'sub-page show';
  div.id = id;
  div.innerHTML = `<div class="sub-header">
    <button class="back-btn" onclick="closeSubPage('${id}')"><i class="fas fa-arrow-left"></i></button>
    <span>${opts.title || ''}</span>
    ${opts.extra || ''}
  </div>
  <div style="flex:1;overflow-y:auto;padding:16px;padding-bottom:30px;">${html}</div>`;
  container.appendChild(div);
  subPageStack.push(id);
  if (opts.onMount) setTimeout(() => opts.onMount(), 50);
}

function closeSubPage(id) {
  playSound('click');
  const el = document.getElementById(id);
  if (el) { el.style.animation = 'slideLeft 0.2s ease reverse'; setTimeout(() => el.remove(), 200); }
  subPageStack = subPageStack.filter(s => s !== id);
}

function openCNBook(id) {
  closeSubPage('cnBooks');
  const book = CN_BOOKS.find(b => b.id === id);
  let pageIdx = 0;
  const pid = 'cnBook_' + id;

  function render() {
    const pg = book.pages[pageIdx];
    const isLast = pageIdx === book.pages.length - 1;
    const html = `
      <div style="margin-bottom:16px;">${getSceneHTML(pg.scene)}</div>
      <div class="card" style="text-align:center;padding:20px;cursor:pointer;" onclick="speak('${pg.text.replace(/'/g,"\\'")}','zh')">
        <ruby style="font-size:24px;line-height:2.2;font-weight:600;">
          ${pg.text.split('').map(ch => {
            const cd = CHINESE_CHARS.find(c => c.c === ch);
            return cd ? `<ruby>${ch}<rp>(</rp><rt style="font-size:12px;color:var(--pink-deep);">${cd.p}</rt><rp>)</rp></ruby>` : ch;
          }).join('')}
        </ruby>
        <div style="font-size:12px;color:var(--text-light);margin-top:8px;">点击文字可朗读</div>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:16px;">
        <button class="btn btn-primary" ${pageIdx===0?'disabled style="opacity:0.4"':''} onclick="cnBookPage('${id}',${pageIdx-1})"><i class="fas fa-arrow-left"></i> 上一页</button>
        <span style="font-size:14px;color:var(--text-light);align-self:center;">${pageIdx+1} / ${book.pages.length}</span>
        ${isLast ? `<button class="btn btn-green" onclick="cnBookQuiz('${id}')">开始答题 <i class="fas fa-check"></i></button>` :
          `<button class="btn btn-primary" onclick="cnBookPage('${id}',${pageIdx+1})">下一页 <i class="fas fa-arrow-right"></i></button>`}
      </div>
      <div style="position:fixed;bottom:80px;right:20px;">${starCharSVG(40)}</div>
    `;
    const el = document.getElementById(pid);
    if (el) {
      const content = el.querySelector('div[style*="overflow-y:auto"]') || el.lastElementChild;
      if (content) content.innerHTML = html;
    }
  }

  window.cnBookPage = function(bookId, idx) {
    playSound('page');
    pageIdx = idx;
    render();
  };

  window.cnBookQuiz = function(bookId) {
    const bk = CN_BOOKS.find(b => b.id === bookId);
    let qi = 0;
    function renderQuiz() {
      if (qi >= bk.quiz.length) {
        addStars(5);
        if (typeof confetti !== 'undefined') confetti({particleCount:100,spread:80});
        playSound('celebrate');
        const content = document.querySelector(`#${pid} div[style*="overflow-y:auto"]`) || document.querySelector(`#${pid} > div:last-child`);
        if (content) content.innerHTML = `
          <div style="text-align:center;padding:40px 0;">
            <div style="font-size:60px;margin-bottom:16px;">🎉</div>
            <div style="font-size:22px;font-weight:800;color:var(--green-deep);">太棒了！</div>
            <div style="font-size:16px;color:var(--text-light);margin-top:8px;">获得5颗星星</div>
            <button class="btn btn-primary" style="margin-top:20px;" onclick="closeSubPage('${pid}')">返回</button>
          </div>`;
        return;
      }
      const q = bk.quiz[qi];
      const content = document.querySelector(`#${pid} div[style*="overflow-y:auto"]`) || document.querySelector(`#${pid} > div:last-child`);
      if (content) content.innerHTML = `
        <div style="text-align:center;padding:20px 0;">
          <div style="font-size:16px;font-weight:700;margin-bottom:20px;">第${qi+1}题</div>
          <div style="font-size:18px;margin-bottom:24px;">${q.q}</div>
          <div style="display:flex;flex-direction:column;gap:12px;">
            ${q.opts.map((o, oi) => `<button class="btn ${oi===0?'btn-pink':'btn-blue'}" style="width:100%;font-size:18px;" onclick="answerCNQuiz('${bookId}',${qi},${oi})">${o}</button>`).join('')}
          </div>
        </div>`;
    }
    window.answerCNQuiz = function(bid, qidx, aidx) {
      const bk2 = CN_BOOKS.find(b => b.id === bid);
      if (aidx === bk2.quiz[qidx].ans) {
        playSound('correct');
        showToast('回答正确！');
        qi++;
        setTimeout(renderQuiz, 600);
      } else {
        playSound('wrong');
        showToast('再想想哦～');
      }
    };
    renderQuiz();
  };

  openSubPage(pid, '', {title: book.title, onMount: render});
}

function startCNCardMode(mode) {
  closeSubPage('cnCards');
  const pid = 'cnCardPlay';
  let cards = [...CHINESE_CHARS];
  let idx = 0;
  let flipped = false;
  let score = 0;

  if (mode === 'review') cards = cards.sort(() => Math.random() - 0.5);
  if (mode === 'test') cards = cards.sort(() => Math.random() - 0.5).slice(0, 10);

  function render() {
    const card = cards[idx];
    let content = '';
    if (mode === 'test') {
      const opts = [card.p];
      while (opts.length < 4) {
        const rp = CHINESE_CHARS[Math.floor(Math.random()*50)].p;
        if (!opts.includes(rp)) opts.push(rp);
      }
      opts.sort(() => Math.random() - 0.5);
      content = `
        <div style="text-align:center;">
          <div style="font-size:100px;font-weight:800;color:#5D4037;margin:20px 0;">${card.c}</div>
          <div style="font-size:40px;margin-bottom:20px;">${card.e}</div>
          <div style="font-size:14px;color:var(--text-light);margin-bottom:16px;">选择正确的拼音</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
            ${opts.map(o => `<button class="btn btn-primary" style="font-size:20px;" onclick="answerCNTest('${o}','${card.p}')">${o}</button>`).join('')}
          </div>
          <div style="margin-top:16px;font-size:14px;color:var(--text-light);">得分：${score} / ${idx}</div>
        </div>`;
    } else {
      content = `
        <div class="flip-card ${flipped?'flipped':''}" style="width:240px;height:300px;margin:0 auto;" onclick="flipCNCard()">
          <div class="flip-card-inner" style="width:100%;height:100%;">
            <div class="flip-card-front" style="background:linear-gradient(135deg,var(--yellow),var(--pink));padding:20px;">
              <div style="font-size:80px;font-weight:800;color:#5D4037;">${card.c}</div>
              <div style="font-size:20px;color:var(--pink-deep);margin-top:8px;">${card.p}</div>
              <div style="font-size:50px;margin-top:12px;">${card.e}</div>
            </div>
            <div class="flip-card-back" style="background:linear-gradient(135deg,var(--purple),var(--blue));padding:20px;color:#fff;">
              <div style="font-size:18px;margin-top:20px;">组词</div>
              <div style="font-size:22px;font-weight:700;margin:8px 0;">${card.w}</div>
              <div style="font-size:18px;margin-top:16px;">例句</div>
              <div style="font-size:18px;font-weight:700;margin:8px 0;">${card.s}</div>
            </div>
          </div>
        </div>
        <div style="text-align:center;margin-top:16px;">
          <button class="btn btn-green" onclick="speak('${card.c}','zh')"><i class="fas fa-volume-up"></i> 朗读</button>
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:20px;">
          <button class="btn btn-primary" ${idx===0?'disabled style="opacity:0.4"':''} onclick="cnCardPrev()"><i class="fas fa-arrow-left"></i></button>
          <span style="font-size:14px;color:var(--text-light);align-self:center;">${idx+1} / ${cards.length}</span>
          <button class="btn btn-primary" onclick="cnCardNext()"><i class="fas fa-arrow-right"></i></button>
        </div>
        ${mode==='review'?'<div style="text-align:center;margin-top:12px;font-size:13px;color:var(--text-light);">点击卡片翻转查看答案</div>':''}
      `;
    }
    const el = document.getElementById(pid);
    if (el) {
      const c = el.querySelector('div[style*="overflow-y:auto"]') || el.lastElementChild;
      if (c) c.innerHTML = content;
    }
  }

  window.flipCNCard = function() {
    flipped = !flipped;
    playSound('flip');
    render();
  };
  window.cnCardPrev = function() { if (idx > 0) { idx--; flipped = false; playSound('page'); render(); } };
  window.cnCardNext = function() {
    if (idx < cards.length - 1) { idx++; flipped = false; playSound('page'); render(); }
    else { addStars(mode==='learn'?3:5); showToast('完成！获得星星'); closeSubPage(pid); }
  };
  window.answerCNTest = function(sel, ans) {
    if (sel === ans) { score++; playSound('correct'); }
    else { playSound('wrong'); }
    idx++;
    if (idx >= cards.length) {
      addStars(5);
      if (typeof confetti !== 'undefined') confetti({particleCount:60,spread:60});
      showToast(`测试完成！得分 ${score}/${cards.length}`);
      setTimeout(() => closeSubPage(pid), 1500);
    } else { render(); }
  };

  openSubPage(pid, '', {title: mode==='learn'?'认识模式':mode==='review'?'复习模式':'测试模式', onMount: render});
}

function openMathGame(type) {
  const pid = 'mathGame_'+type;
  let score = 0, round = 0, maxRounds = 5;

  function genRound() {
    if (type === 'match') {
      const num = Math.floor(Math.random()*9)+1;
      return {num, dots: Array(num).fill(0).map((_,i)=>({id:i,placed:false}))};
    } else if (type === 'compare') {
      const l = Math.floor(Math.random()*5)+1, r = Math.floor(Math.random()*5)+1;
      return {left:l, right:r, ans: l>r?'left':l<r?'right':'same'};
    } else if (type === 'shape') {
      const shapes = [];
      const types = ['circle','square','triangle'];
      for(let i=0;i<6;i++){
        const t = types[Math.floor(Math.random()*3)];
        const colors = ['#FFB5C2','#B5D8FF','#B5FFD8'];
        shapes.push({type:t, color:colors[types.indexOf(t)], placed:false, id:i});
      }
      return {shapes};
    } else if (type === 'pattern') {
      const colors = ['#FFB5C2','#B5D8FF','#B5FFD8','#D8B5FF','#FFE8B5'];
      const c1 = colors[Math.floor(Math.random()*5)];
      let c2 = colors.filter(c=>c!==c1)[Math.floor(Math.random()*4)];
      const seq = [];
      for(let i=0;i<5;i++) seq.push(i%2===0?c1:c2);
      const correctNext = seq.length%2===0?c1:c2;
      const opts = [correctNext];
      while(opts.length<3){const rc=colors[Math.floor(Math.random()*5)];if(!opts.includes(rc))opts.push(rc);}
      opts.sort(()=>Math.random()-0.5);
      return {seq, opts, ans:correctNext};
    }
  }

  let data = genRound();

  function render() {
    let html = `<div style="text-align:center;margin-bottom:12px;font-size:14px;color:var(--text-light);">第${round+1}轮 | 得分：${score}</div>`;

    if (type === 'match') {
      html += `<div style="text-align:center;margin-bottom:16px;">
        <div style="font-size:60px;font-weight:800;color:var(--blue-deep);">${data.num}</div>
        <div style="font-size:14px;color:var(--text-light);margin-top:4px;">拖拽圆点到框里</div>
      </div>
      <div id="matchDrop" class="drop-zone" style="min-height:80px;margin-bottom:16px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:12px;">
        ${Array(data.num).fill(0).map((_,i)=>`<div style="width:40px;height:40px;border-radius:50%;border:2px dashed #ccc;"></div>`).join('')}
      </div>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
        ${data.dots.map((d,i)=>`<div class="draggable" data-idx="${i}" style="width:40px;height:40px;border-radius:50%;background:var(--yellow-deep);cursor:grab;touch-action:none;" ${d.placed?'style="opacity:0.3"':''}></div>`).join('')}
      </div>`;
    } else if (type === 'compare') {
      html += `<div style="display:flex;justify-content:space-around;margin:20px 0;">
        <div style="text-align:center;"><div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:center;">${Array(data.left).fill('🍎').map(a=>`<span style="font-size:32px;">${a}</span>`).join('')}</div><div style="font-size:14px;margin-top:4px;">左边</div></div>
        <div style="text-align:center;"><div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:center;">${Array(data.right).fill('🍎').map(a=>`<span style="font-size:32px;">${a}</span>`).join('')}</div><div style="font-size:14px;margin-top:4px;">右边</div></div>
      </div>
      <div style="display:flex;gap:10px;justify-content:center;">
        <button class="btn btn-pink" onclick="compareAns('left')">左边多</button>
        <button class="btn btn-primary" onclick="compareAns('same')">一样多</button>
        <button class="btn btn-blue" onclick="compareAns('right')">右边多</button>
      </div>`;
    } else if (type === 'shape') {
      html += `<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:20px;">
        ${data.shapes.map((s,i)=>`<div class="draggable" data-shape-idx="${i}" style="width:50px;height:50px;touch-action:none;cursor:grab;">
          ${s.type==='circle'?`<div style="width:50px;height:50px;border-radius:50%;background:${s.color};"></div>`:
            s.type==='square'?`<div style="width:50px;height:50px;border-radius:4px;background:${s.color};"></div>`:
            `<div style="width:0;height:0;border-left:25px solid transparent;border-right:25px solid transparent;border-bottom:50px solid ${s.color};"></div>`}
        </div>`).join('')}
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;">
        <div class="drop-zone" data-bucket="circle" style="text-align:center;padding:12px;"><div style="font-size:24px;">⭕</div><div style="font-size:12px;">圆形</div></div>
        <div class="drop-zone" data-bucket="square" style="text-align:center;padding:12px;"><div style="font-size:24px;">🟦</div><div style="font-size:12px;">方形</div></div>
        <div class="drop-zone" data-bucket="triangle" style="text-align:center;padding:12px;"><div style="font-size:24px;">🔺</div><div style="font-size:12px;">三角</div></div>
      </div>`;
    } else if (type === 'pattern') {
      html += `<div style="display:flex;gap:8px;justify-content:center;margin:20px 0;flex-wrap:wrap;">
        ${data.seq.map(c=>`<div style="width:40px;height:40px;border-radius:8px;background:${c};"></div>`).join('')}
        <div style="width:40px;height:40px;border-radius:8px;border:3px dashed #999;display:flex;align-items:center;justify-content:center;font-size:20px;">?</div>
      </div>
      <div style="font-size:14px;text-align:center;color:var(--text-light);margin-bottom:16px;">下一个是什么颜色？</div>
      <div style="display:flex;gap:10px;justify-content:center;">
        ${data.opts.map(c=>`<button class="btn" style="background:${c};width:60px;height:60px;border-radius:12px;" onclick="patternAns('${c}')"></button>`).join('')}
      </div>`;
    }

    const el = document.getElementById(pid);
    if (el) { const c = el.querySelector('div[style*="overflow-y:auto"]')||el.lastElementChild; if(c) c.innerHTML=html; }

    // Setup drag for match game
    if (type === 'match') setupMatchDrag();
    if (type === 'shape') setupShapeDrag();
  }

  function setupMatchDrag() {
    setTimeout(() => {
      const draggables = document.querySelectorAll('#'+pid+' .draggable');
      const dropZone = document.getElementById('matchDrop');
      if (!dropZone) return;
      let placedCount = 0;
      draggables.forEach(d => {
        const handler = (e) => {
          e.preventDefault();
          d.style.opacity = '0.4';
          placedCount++;
          playSound('click');
          if (placedCount >= data.num) {
            playSound('correct');
            score++;
            showToast('正确！');
            setTimeout(nextRound, 800);
          }
        };
        d.addEventListener('click', handler);
        d.addEventListener('touchend', handler);
      });
    }, 100);
  }

  function setupShapeDrag() {
    setTimeout(() => {
      const items = document.querySelectorAll('#'+pid+' .draggable');
      const buckets = document.querySelectorAll('#'+pid+' .drop-zone');
      items.forEach(item => {
        const idx = parseInt(item.dataset.shapeIdx);
        if (isNaN(idx)) return;
        const handler = () => {
          const shape = data.shapes[idx];
          if (shape.placed) return;
          // Simple click-to-select then click-bucket approach for mobile
          showToast('请点击下方的分类筐', 1000);
          buckets.forEach(b => {
            b.onclick = () => {
              const bucket = b.dataset.bucket;
              if (shape.type === bucket) {
                shape.placed = true;
                score++;
                playSound('correct');
                item.style.opacity = '0.3';
                item.style.pointerEvents = 'none';
                b.style.background = 'rgba(102,187,106,0.2)';
                b.style.borderColor = 'var(--green-deep)';
                const allPlaced = data.shapes.every(s => s.placed);
                if (allPlaced) { showToast('全部分类正确！'); setTimeout(nextRound, 800); }
              } else {
                playSound('wrong');
                showToast('再试试～');
              }
            };
          });
        };
        item.addEventListener('click', handler);
      });
    }, 100);
  }

  window.compareAns = function(ans) {
    if (ans === data.ans) { score++; playSound('correct'); showToast('正确！'); }
    else { playSound('wrong'); showToast('再想想～'); }
    setTimeout(nextRound, 600);
  };

  window.patternAns = function(c) {
    if (c === data.ans) { score++; playSound('correct'); showToast('正确！'); }
    else { playSound('wrong'); showToast('再想想～'); }
    setTimeout(nextRound, 600);
  };

  function nextRound() {
    round++;
    if (round >= maxRounds) {
      addStars(5);
      if (typeof confetti !== 'undefined') confetti({particleCount:80,spread:70});
      showToast(`游戏结束！得分 ${score}/${maxRounds}，获得5⭐`);
      setTimeout(() => closeSubPage(pid), 1500);
    } else {
      data = genRound();
      render();
    }
  }

  const titles = {match:'点数匹配',compare:'比大小',shape:'图形分类',pattern:'找规律'};
  openSubPage(pid, '', {title: titles[type], onMount: render});
}

function openSong(idx) {
  closeSubPage('enSongs');
  const song = SONGS[idx];
  const pid = 'song_'+idx;
  let playing = false, lineIdx = -1, timer = null;

  function render() {
    const html = `
      <div style="text-align:center;margin-bottom:16px;">
        <div style="font-size:50px;margin-bottom:8px;">${song.icon}</div>
        <div style="font-size:18px;font-weight:700;">${song.title}</div>
      </div>
      <div id="lyricsBox" style="margin-bottom:20px;">
        ${song.lyrics.map((l,i)=>`<div class="lyric-line ${i===lineIdx?'active':''}" style="cursor:pointer;" onclick="speakLine(${i})">${l}</div>`).join('')}
      </div>
      <div style="display:flex;gap:10px;justify-content:center;margin-bottom:12px;">
        <button class="btn btn-green" id="playBtn" onclick="togglePlay()"><i class="fas ${playing?'fa-pause':'fa-play'}"></i> ${playing?'暂停':'播放'}</button>
        <button class="btn btn-primary" onclick="replaySong()"><i class="fas fa-redo"></i> 重播</button>
      </div>
      <div style="text-align:center;font-size:13px;color:var(--text-light);">点击任意歌词行可单独朗读</div>
    `;
    const el = document.getElementById(pid);
    if (el) { const c = el.querySelector('div[style*="overflow-y:auto"]')||el.lastElementChild; if(c) c.innerHTML=html; }
  }

  window.togglePlay = function() {
    playing = !playing;
    if (playing) {
      lineIdx = -1;
      nextLine();
    } else {
      if (timer) clearTimeout(timer);
      speechSynthesis.cancel();
    }
    render();
  };

  window.replaySong = function() {
    playing = false;
    if (timer) clearTimeout(timer);
    speechSynthesis.cancel();
    lineIdx = -1;
    playing = true;
    nextLine();
    render();
  };

  window.speakLine = function(i) {
    speak(song.lyrics[i], 'en');
  };

  function nextLine() {
    lineIdx++;
    if (lineIdx >= song.lyrics.length) {
      playing = false;
      addStars(2);
      showToast('听完一首歌 +2⭐');
      render();
      return;
    }
    render();
    speak(song.lyrics[lineIdx], 'en');
    timer = setTimeout(nextLine, 2500);
  }

  openSubPage(pid, '', {title: song.title, onMount: render});
}

    const html = `

        ${categories.map(c=>`<button class="btn ${c===curCat?'btn-green':'btn-primary'}" style="font-size:13px;padding:8px 14px;" onclick="switchEnCat('${c}')">${catNames[c]}</button>`).join('')}

        </div>
        <div style="display:flex;justify-content:space-between;margin-top:20px;">
          <button class="btn btn-primary" ${idx===0?'disabled style="opacity:0.4"':''} onclick="enCardPrev()"><i class="fas fa-arrow-left"></i></button>

      </div>
    `;
    const el = document.getElementById(pid);
    if (el) { const c = el.querySelector('div[style*="overflow-y:auto"]')||el.lastElementChild; if(c) c.innerHTML=html; }
  }

  window.switchEnCat = function(cat) { curCat=cat; idx=0; playSound('click'); render(); };
  window.enCardPrev = function() { if(idx>0){idx--;playSound('page');render();} };
  window.enCardNext = function() {

    const s = getState();

    s.enCardProgress[key] = known;
    saveState(s);
    playSound(known?'correct':'click');

function drawCharts() {
  const s = getState();
  // Pie chart - module usage
  const pieCanvas = document.getElementById('pieChart');
  if (pieCanvas) {
    const ctx = pieCanvas.getContext('2d');
    const data = [
      {label:'语文',value:s.moduleSwitch.cn_book||s.moduleSwitch.cn_card?35:0,color:'#FFB5C2'},
      {label:'数学',value:s.moduleSwitch.math_story||s.moduleSwitch.math_game?30:0,color:'#B5D8FF'},
      {label:'英语',value:s.moduleSwitch.en_song||s.moduleSwitch.en_book||s.moduleSwitch.en_card?35:0,color:'#B5FFD8'}
    ];
    const total = data.reduce((a,d)=>a+d.value,0) || 1;
    let startAngle = -Math.PI/2;
    const cx = 125, cy = 90, r = 70;
    data.forEach(d => {
      const slice = (d.value/total)*2*Math.PI;
      ctx.beginPath();
      ctx.moveTo(cx,cy);
      ctx.arc(cx,cy,r,startAngle,startAngle+slice);
      ctx.fillStyle = d.color;
      ctx.fill();
      const mid = startAngle+slice/2;
      ctx.fillStyle = '#333';
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(d.label, cx+Math.cos(mid)*(r*0.6), cy+Math.sin(mid)*(r*0.6)+4);
      startAngle += slice;
    });
  }
  // Bar chart - 7 days
  const barCanvas = document.getElementById('barChart');
  if (barCanvas) {
    const ctx = barCanvas.getContext('2d');
    const days = [];
    for(let i=6;i>=0;i--){
      const d = new Date(); d.setDate(d.getDate()-i);
      const key = `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
      days.push({label:['日','一','二','三','四','五','六'][d.getDay()], val: (s.weekData&&s.weekData[key])||0});
    }
    const maxVal = Math.max(...days.map(d=>d.val),1);
    const bw = 28, gap = 12, startX = 20, baseY = 140;
    days.forEach((d,i) => {
      const x = startX + i*(bw+gap);
      const h = Math.max((d.val/maxVal)*110, 2);
      ctx.fillStyle = i===6?'#FFD54F':'#B5D8FF';
      ctx.beginPath();
      ctx.roundRect(x, baseY-h, bw, h, [4,4,0,0]);
      ctx.fill();
      ctx.fillStyle = '#888';
      ctx.font = '11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(d.label, x+bw/2, baseY+14);
      if(d.val>0) ctx.fillText(d.val+'分', x+bw/2, baseY-h-4);
    });
  }
}

window.setTimeLimit = function(m) {
  const s = getState(); s.timeLimit = m; saveState(s);

  closeSubPage('parentPanel'); openParentPanel();

window.toggleModule = function(k) {

window.exportData = function() {
  const s = getState();
  const blob = new Blob([JSON.stringify(s,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '小星星启蒙乐园_数据_'+getDayKey()+'.json';
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('数据已导出');
};

window.importData = function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const data = JSON.parse(ev.target.result);
      saveState({...DEFAULT_STATE, ...data});
      showToast('数据导入成功');
      document.getElementById('headerStars').textContent = data.stars || 0;
      closeSubPage('parentPanel');
    } catch(err) { showToast('文件格式错误'); }
  };
  reader.readAsText(file);
};

window.doReset = function(btn) {
  localStorage.removeItem('starLearn');

window.changePwd = function() {

  const s = getState(); s.parentPwd = np.value; saveState(s);

};

// ==================== LEARNING TIME TRACKER ====================

let learnTimer = null;
function startLearnTimer() {
  if (learnTimer) return;
  learnTimer = setInterval(() => {
    const s = getState();
    s.todayTime = (s.todayTime || 0) + 1;
    const dk = getDayKey();
    if (!s.weekData) s.weekData = {};
    s.weekData[dk] = Math.floor(s.todayTime / 60);
    // Clean old week data
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-8);
    Object.keys(s.weekData).forEach(k => {
      const parts = k.split('-');
      const d = new Date(parts[0],parts[1]-1,parts[2]);
      if (d < cutoff) delete s.weekData[k];
    });
    saveState(s);
    // Check time limit
    const limit = s.timeLimit || 30;
    if (Math.floor(s.todayTime/60) >= limit && Math.floor(s.todayTime/60) === limit) {
      showToast('今日学习时间已到，休息一下吧！');
      playSound('wrong');
    }
  }, 1000);
}

// Canvas roundRect polyfill
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r) {
    if (!Array.isArray(r)) r = [r,r,r,r];
    this.moveTo(x+r[0],y);
    this.lineTo(x+w-r[1],y);
    this.quadraticCurveTo(x+w,y,x+w,y+r[1]);
    this.lineTo(x+w,y+h-r[2]);
    this.quadraticCurveTo(x+w,y+h,x+w-r[2],y+h);
    this.lineTo(x+r[3],y+h);
    this.quadraticCurveTo(x,y+h,x,y+h-r[3]);
    this.lineTo(x,y+r[0]);
    this.quadraticCurveTo(x,y,x+r[0],y);
    this.closePath();
  };
}
