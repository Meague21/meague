  function startSession(cfg) {
    cfg.idx = 0; cfg.correct = 0; cfg.total = cfg.questions.length;
    cfg.newWrong = 0;
    cfg.startTs = Date.now();
    if (window.SCRATCH) SCRATCH.show();
    if (window.GARDEN) GARDEN.startActivity("practice", cfg.title || "练习");
    session = cfg;
    ["practiceHome", "practiceSetup", "practiceResult"].forEach(function (id) { $("#" + id).classList.add("hidden"); });
    $("#practiceSession").classList.remove("hidden");
    if (cfg.timed) {
      cfg.left = cfg.timed;
      cfg.timer = setInterval(function () {
        cfg.left--;
        var t = $("#sessTimer");
        if (t) t.textContent = cfg.left;
        if (cfg.left <= 0) { clearInterval(cfg.timer); endSession(); }
      }, 1000);
    }
    renderQuestion();
  }

  function renderQuestion() {
    var cfg = session, q = cfg.questions[cfg.idx];
    var el = $("#practiceSession");
    var tagCls = { kousuan: "tt-kousuan", tuoshi: "tt-tuoshi", shushi: "tt-shushi", tiankong: "tt-tiankong", xuanze: "tt-xuanze", panduan: "tt-panduan", yingyong: "tt-yingyong", guilv: "tt-guilk", dubiao: "tt-tiankong", guancha: "tt-panduan" };
    var html = '<div class="back-row"><button class="back-btn" id="exitSess">‹</button>' +
      '<div class="page-title">' + esc(cfg.title) + '</div>' +
      (cfg.timed ? '<span class="chip blue">⏱ <b id="sessTimer">' + cfg.left + '</b>s</span>' : '') + '</div>' +
      '<div class="progress-bar"><i style="width:' + (cfg.idx / cfg.total * 100) + '%"></i></div>' +
      '<div class="qcard"><div class="q-top">' +
      '<span class="q-type-tag ' + (tagCls[q.type] || "tt-tiankong") + '">' + (QE.TYPE_NAME[q.type] || q.type) + '</span>' +
      '<span class="q-progress">' + (cfg.idx + 1) + ' / ' + cfg.total + '</span></div>' +
      '<div class="q-text">' + q.q + '</div>';

    if (q.input === "choice") {
      var letters = ["A", "B", "C", "D"];
      html += '<div class="opt-list">' + q.options.map(function (o, i) {
        return '<button class="opt-btn" data-opt="' + esc(o) + '"><span class="opt-letter">' + letters[i] + '</span><span>' + esc(o) + '</span></button>';
      }).join("") + '</div>';
    } else if (q.input === "choiceHtml") {
      html += '<div class="opt-grid">' + q.optHtml.map(function (h, i) {
        return '<button class="opt-cell" data-idx="' + i + '">' + h + '</button>';
      }).join("") + '</div>';
    } else if (q.input === "judge") {
      html += '<div class="judge-row"><button class="judge-btn" data-j="对">✔ 对</button><button class="judge-btn" data-j="错">✘ 错</button></div>';
    } else {
      html += '<input class="answer-input" id="ansInput" placeholder="在这里写答案" autocomplete="off" inputmode="' + (q.input === "num" ? "decimal" : "text") + '">';
    }
    html += '<div class="feedback" id="fb"></div>' +
      '<div style="margin-top:14px;display:flex;gap:10px">' +
      '<button class="btn block" id="btnCheck">✅ 提交答案</button>' +
      '<button class="btn block hidden" id="btnNext">下一题 →</button></div></div>';
    el.innerHTML = html;

    $("#exitSess").onclick = function () {
      if (session && session.timer) clearInterval(session.timer);
      if (window.SCRATCH) SCRATCH.hide();
      renderPracticeHome();
    };

    var answered = false, userAns = null;

    $$(".opt-btn", el).forEach(function (b) {
      b.onclick = function () {
        if (answered) return;
        $$(".opt-btn", el).forEach(function (x) { x.classList.remove("sel"); });
        b.classList.add("sel");
        userAns = b.dataset.opt;
      };
    });
    $$(".opt-cell", el).forEach(function (b) {
      b.onclick = function () {
        if (answered) return;
        $$(".opt-cell", el).forEach(function (x) { x.classList.remove("sel"); });
        b.classList.add("sel");
        userAns = b.dataset.idx;
      };
    });
    $$(".judge-btn", el).forEach(function (b) {
      b.onclick = function () {
        if (answered) return;
        $$(".judge-btn", el).forEach(function (x) { x.classList.remove("sel"); });
        b.classList.add("sel");
        userAns = b.dataset.j;
      };
    });
    var inp = $("#ansInput", el);
    if (inp) inp.onkeydown = function (e) { if (e.key === "Enter") $("#btnCheck").click(); };

    $("#btnCheck").onclick = function () {
      if (answered) return;
      var val;
      if (q.input === "choice" || q.input === "judge" || q.input === "choiceHtml") val = userAns;
      else val = inp ? inp.value.trim() : "";
      if (val === "" || val == null) { toast("先写个答案再提交哦～"); return; }
      answered = true;
      cfg.done = (cfg.done || 0) + 1;

      var ok = checkAnswer(q, val);
      if (window.SND) ok ? SND.correct() : SND.wrong();
      if (ok) { cfg.correct++; if (window.GARDEN) GARDEN.addPoints(0.5, "答对一题"); }
      else {
        // 收录错题
        var meta = findUnitMeta(q.unit);
        if (meta) {
          WB.add(q, {
            book: meta.book.key, bookLabel: meta.book.label,
            unitTitle: "第" + meta.unit.num + "单元 " + meta.unit.title,
            typeName: QE.TYPE_NAME[q.type] || q.type
          });
          cfg.newWrong++;
        }
        if (window.GARDEN) GARDEN.deductPoints(0.3, "答错题");
      }
      var whyWrong = "";
      if (!ok) {
        whyWrong = q.explain ? q.explain : ("正确答案是 " + showAns(q) + "，再想想这类题的方法～");
      }
      var fb = $("#fb");
      fb.className = "feedback show " + (ok ? "ok" : "no");
      fb.innerHTML = '<div class="fb-title">' + (ok ? "🎉 回答正确！" : "❌ 再想想～ 正确答案是：" + showAns(q) + (metaOf(q) ? "<br><span style='font-size:12px;color:#8a4b0f'>已放进错题本，之后可以举一反三巩固它 📒</span>" : "")) + '</div>' +
        (whyWrong ? '<div class="fb-why">💡 为什么：' + whyWrong + '</div>' : (q.explain ? '<div class="fb-exp">📖 ' + q.explain + '</div>' : ''));
      $$(".opt-btn", el).forEach(function (b) {
        if (norm(b.dataset.opt) === norm(q.ans)) b.classList.add("correct");
        else if (b.classList.contains("sel") && !ok) b.classList.add("wrong");
        b.disabled = true;
      });
      $$(".opt-cell", el).forEach(function (b) {
        if (b.dataset.idx === String(q.ans)) b.classList.add("correct");
        else if (b.classList.contains("sel") && !ok) b.classList.add("wrong");
        b.disabled = true;
      });
      $$(".judge-btn", el).forEach(function (b) {
        if (b.dataset.j === q.ans) b.classList.add("correct");
        else if (b.classList.contains("sel") && !ok) b.classList.add("wrong");
        b.disabled = true;
      });
      if (inp) inp.disabled = true;
      $("#btnCheck").classList.add("hidden");
      $("#btnNext").classList.remove("hidden");
    };

    $("#btnNext").onclick = function () {
      cfg.idx++;
      if (cfg.idx >= cfg.total) endSession();
      else renderQuestion();
    };
  }
  function metaOf(q) { return q.unit ? findUnitMeta(q.unit) : null; }

  function checkAnswer(q, val) {
    if (q.input === "choiceHtml") return norm(val) === norm(q.ans);
    var list = [q.ans];
    if (q.accept) list = list.concat(q.accept);
    if (q.input === "num") {
      var v = parseFloat(String(val).replace(/[元角分米厘米个本棵人千米克吨支平方]/g, ""));
      for (var i = 0; i < list.length; i++) {
        var a = parseFloat(list[i]);
        if (!isNaN(a) && !isNaN(v) && Math.abs(a - v) < 0.001) return true;
        if (norm(list[i]) === norm(val)) return true;
      }
      return false;
    }
    for (var j = 0; j < list.length; j++) {
      if (norm(list[j]) === norm(val)) return true;
    }
    return false;
  }
  function showAns(q) {
    if (q.input === "choiceHtml") return "图中正确的那个形状";
    return esc(q.ans);
  }

  function endSession() {
    var cfg = session;
    if (cfg.timer) clearInterval(cfg.timer);
    if (window.SCRATCH) SCRATCH.hide();
    ["practiceHome", "practiceSetup", "practiceSession"].forEach(function (id) { $("#" + id).classList.add("hidden"); });
    var el = $("#practiceResult");
    el.classList.remove("hidden");
    var denom = cfg.timed ? (cfg.done || cfg.correct || 1) : cfg.total;
    var acc = denom ? Math.round(cfg.correct / denom * 100) : 0;
    var stars = acc >= 90 ? 3 : (acc >= 70 ? 2 : (acc >= 50 ? 1 : 0));

    /* 学习时长 + 积分（自主学习自动累积） */
    var earnedBonus = 0;
    if (window.GARDEN && cfg.startTs) {
      GARDEN.endActivity();
      GARDEN.addStudy((Date.now() - cfg.startTs) / 1000);
      GARDEN.addSession(cfg.correct, cfg.total);
      var bonus = acc >= 100 ? 1.5 : (acc >= 60 ? 1 : 0.5);
      earnedBonus = GARDEN.addPoints(bonus, "完成练习");
    }

    /* 举一反三巩固结果判定 */
    var similarNote = "";
    if (cfg.similar) {
      if (acc === 100) {
        WB.master(cfg.similar);
        similarNote = '<div class="kbox tip" style="text-align:left">🏅 三道同类题全部答对，这道错题已经掌握，移出待巩固列表！</div>';
      } else {
        similarNote = '<div class="kbox warn" style="text-align:left">还差一点点！这道错题留在错题本里，回头再来挑战～</div>';
      }
    }

    var msg = stars === 3 ? "太厉害了！知识点完全掌握！🏆" :
      stars === 2 ? "很不错！再练练就能拿满星啦！" :
      stars === 1 ? "继续加油！回到学一学复习一下再来！" :
      "没关系，我们回去把知识点再看一遍，一定行！";
    if (cfg.unit && cfg.unit !== "all" && !cfg.similar) {
      var old = progress[cfg.unit];
      if (!old || acc > old.acc) progress[cfg.unit] = { acc: acc, stars: Math.max(stars, old ? old.stars : 0) };
      saveProgress();
    }
    el.innerHTML = '<div class="result-card">' +
      '<div style="font-size:14px;color:var(--ink-2);font-weight:700">' + esc(cfg.title) + ' · 完成！</div>' +
      '<div class="result-stars">' + "⭐".repeat(stars) + "☆".repeat(3 - stars) + '</div>' +
      '<div class="result-score">' + acc + '<span style="font-size:20px">%</span></div>' +
      '<div style="font-size:13px;color:var(--ink-2)">答对 ' + cfg.correct + ' 题' + (cfg.timed ? '（共作答 ' + denom + ' 题）' : ' / 共 ' + cfg.total + ' 题') + '</div>' +
      '<div class="result-msg">' + msg + '</div>' +
      (earnedBonus > 0 ? '<div class="kbox tip" style="text-align:left">🌟 自主学习奖励：+' + earnedBonus + ' 积分（可去家园领养宠物、种植物）</div>' : '') +
      (cfg.newWrong > 0 && !cfg.similar ? '<div class="kbox warn" style="text-align:left">📒 本次新增 ' + cfg.newWrong + ' 道错题，已放进错题本</div>' : '') +
      similarNote +
      '<div class="result-btns" style="margin-top:12px">' +
      '<button class="btn ghost" id="rBack">' + (cfg.similar ? "返回错题本" : "返回练习") + '</button>' +
      '<button class="btn" id="rAgain">再来一次</button></div></div>';
    $("#rBack").onclick = cfg.similar ? renderWrongBook : renderPracticeHome;
    $("#rAgain").onclick = function () {
      if (cfg.similar) {
        var entry = null;
        WB.all().forEach(function (e) { if (e.id === cfg.similar) entry = e; });
        if (entry) startSimilarSession(entry);
        else renderWrongBook();
      } else if (cfg.unit && cfg.unit !== "all") openPracticeSetup(cfg.unit);
      else if (cfg.timed) startQuickSession();
      else startTestSession();
    };
    if (stars === 3) confettiBurst();
  }

  /* =====================================================
   * 错题本
   * ===================================================== */
  function renderWrongBook() {
    ["practiceSetup", "practiceSession", "practiceResult"].forEach(function (id) { $("#" + id).classList.add("hidden"); });
    var el = $("#practiceHome");
    el.classList.remove("hidden");
    var pending = WB.pending();
    var mastered = WB.all().filter(function (e) { return e.mastered; });

    var html = '<div class="back-row"><button class="back-btn" id="wbBack">‹</button>' +
      '<div class="page-title">📒 错题本</div></div>';

    if (!pending.length && !mastered.length) {
      html += '<div class="card" style="text-align:center;padding:40px 20px">' +
        '<div style="font-size:44px">🎉</div>' +
        '<div style="font-weight:800;margin:8px 0">错题本是空的</div>' +
        '<div style="font-size:13px;color:var(--ink-2)">做错的题会自动收录到这里，<br>用"举一反三"把它们逐个消灭！</div></div>';
    }

    if (pending.length) {
      html += '<div class="section-title"><span class="bar" style="background:#ef476f"></span>待巩固（' + pending.length + ' 题）</div>';
      html += '<div class="card" style="font-size:12.5px;color:var(--ink-2)">💡 点「举一反三」，会按这道题的知识点出 3 道同类题，全部答对就算掌握！</div>';

  function renderUnitPicwordQ(el, state, meta) {
    var it = state.qs[state.idx];
    var inputHtml;
    if (it.input === "choice") {
      inputHtml = '<div class="opt-list">' + it.options.map(function (o, i) {
        return '<button class="opt-btn" data-opt="' + esc(o) + '"><span class="opt-letter">' + ["A", "B", "C", "D"][i] + '</span><span>' + esc(o) + '</span></button>';

    var stepsHtml = it.steps.map(function (s) { return '<div class="step-item">' + s + '</div>'; }).join("");
    var prog = '<div style="text-align:center;font-size:12px;color:var(--ink-3);margin-bottom:6px">' + esc(it.topic) + ' · ' + (state.idx + 1) + ' / ' + state.qs.length + (meta ? ' · ' + esc(meta.title) : '') + '</div>';

      '<div style="margin-top:14px;display:flex;gap:10px">' +
      '<button class="btn block" id="btnCheck">✅ 提交答案</button>' +
      '<button class="btn block hidden" id="btnNext">' + (state.idx + 1 < state.qs.length ? '下一题 →' : '完成 🎉') + '</button></div></div>';
    $("#pwSessBack").onclick = renderPicwordHome;
    var answered = false, userAns = null;
    $$(".opt-btn", el).forEach(function (b) { b.onclick = function () { if (answered) return; $$(".opt-btn", el).forEach(function (x) { x.classList.remove("sel"); }); b.classList.add("sel"); userAns = b.dataset.opt; }; });

    var pets = items("pets"), plants = items("plants");
    var html = '<div class="home-scene" style="background:linear-gradient(' + bg.sky + ' 0%,' + bg.sky + ' 55%,' + bg.ground + ' 55%,' + bg.ground + ' 100%)">' +
      '<div class="hs-sky">' + (bg.id === "stars" ? "✨　　🌙　　⭐" : bg.id === "snow" ? "❄️　　☁️　　❄️" : "☁️　　☀️　　☁️") + '</div>' +
      '<div class="hs-house">🏠</div>' +
      '<div class="hs-row">' + (plants || '<span class="hs-empty">还没种植物，去「领养」看看吧～</span>') + '</div>' +
      '<div class="hs-row">' + (pets || '<span class="hs-empty">还没有宠物，用积分领养一只，喂养它长大！</span>') + '</div>' +
      '</div>';

    if (gardenSel) html += renderSelPanel();
    html += '<div class="card" style="font-size:12.5px;color:var(--ink-2)">点一点宠物/植物，用食物喂养它，看它一步步长大～ 积分通过学习获得哦！</div>';
    return html;
  }

  function renderSelPanel() {
    var G = window.GARDEN;
    var it = G.findItem(gardenSel.kind, gardenSel.id);
    var owned = G.findOwned(gardenSel.kind, gardenSel.id);
    if (!it || !owned) return "";
    var icon = it.icons[owned.stage], name = it.names[owned.stage];
    var maxed = owned.stage >= G.MAX_STAGE;
    var nutPct = Math.min(100, Math.round(owned.nut / G.STAGE_NUT * 100));
    var bigSvg = gardenSel.kind === "pets" && window.PETS && PETS.has(gardenSel.id) ? PETS.render(gardenSel.id, owned.stage) : null;
    var avatarHtml = bigSvg
      ? '<span class="pet-wrap" style="width:84px;height:84px">' + bigSvg + '</span>'
      : '<span style="font-size:44px">' + icon + '</span>';
    var html = '<div class="card feed-card">' +
      '<div style="display:flex;align-items:center;gap:12px">' +
      '<div style="position:relative;text-align:center">' + avatarHtml +
      (gardenBubble ? '<div class="feed-bubble">' + gardenBubble + '</div>' : '') + '</div>' +
      '<div style="flex:1"><div style="font-weight:800;font-size:15px">' + it.name + ' · ' + name + '</div>' +
      '<div style="font-size:12px;color:#a8a9b5;margin:3px 0">成长 ' + (owned.stage + 1) + ' / ' + (G.MAX_STAGE + 1) + ' 级' +
      (maxed ? ' · 已长大🎉' : ' · 营养 ' + owned.nut + '/' + G.STAGE_NUT) + '</div>' +
      (maxed ? '' : '<div class="gp-bar" style="height:8px"><i style="width:' + nutPct + '%;background:linear-gradient(90deg,#06d6a0,#0a7fa0)"></i></div>') +
      '<div class="feed-stage">' + it.icons.map(function (ic, i) {
        return '<span class="fs-dot' + (i <= owned.stage ? " on" : "") + '">' + ic + '</span>';
      }).join('<span class="fs-arrow">→</span>') + '</div></div></div>';
    if (!maxed) {
      html += '<div style="margin-top:10px;font-size:12.5px;font-weight:700;color:var(--ink-2)">选食物喂养：</div>' +
        '<div class="food-row">' + G.SHOP.foods.map(function (f) {
          return '<button class="food-chip' + (gardenFood === f.id ? " sel" : "") + '" data-food="' + f.id + '">' +
            '<span style="font-size:20px">' + f.icon + '</span><span>' + f.name + '</span><span class="food-cost">' + f.cost + '分</span></button>';
        }).join("") + '</div>' +
        '<button class="btn block feed-btn" id="feedBtn" style="margin-top:10px">🍼 喂养它（说谢谢哦）</button>';
    }
    if (gardenSel.kind === "pets") {
      var ownedAcc = G.state().inv.acc;
      if (ownedAcc.length) {
        html += '<div style="margin-top:10px;font-size:12.5px;font-weight:700;color:var(--ink-2)">给它戴配饰：</div><div class="food-row">' +
          ownedAcc.map(function (aid) {
            var a = G.findItem("acc", aid);
            return '<button class="food-chip' + (owned.acc === aid ? " sel" : "") + '" data-eq="' + aid + '">' + a.icon + ' ' + a.name + '</button>';
          }).join("") + '</div>';
      }
    }
    html += '<div class="name-row"><input id="petNameInput" placeholder="给 TA 取个名字吧～" maxlength="8" value="' + esc(owned.nick || '') + '">' +
      '<button class="btn" id="petNameSave" style="padding:8px 14px">💾 保存名字</button></div>';
    html += '</div>';
    return html;
  }

  function renderShop() {
    var G = window.GARDEN, st = G.state();
    function cards(kind) {
      return G.SHOP[kind].map(function (it) {
        var owned = G.findOwned(kind, it.id);
        var afford = st.points >= it.cost;
        return '<div class="shop-card">' +
          '<span class="sc-icon">' + it.icons[it.icons.length - 1] + '</span>' +
          '<span style="flex:1"><span class="sc-name">' + it.name + '</span> <span class="sc-stage">' + it.icons.join("→") + '</span><br>' +
          '<span class="sc-desc">' + (G.MAX_STAGE + 1) + ' 级成长，喂养长大</span></span>' +
          (owned ? '<span class="sc-owned">已领养</span>' :
            '<button class="btn sc-buy' + (afford ? '' : ' dis') + '" data-kind="' + kind + '" data-id="' + it.id + '">' + it.cost + ' 分</button>') +
          '</div>';
      }).join("");
    }
    return '<div class="card" style="font-size:12.5px;color:var(--ink-2)">领养后它还小小的，要用<b>食物喂养</b>攒营养，才能一级级长大～</div>' +
      '<div class="section-title" style="margin-top:10px"><span class="bar" style="background:#ff7a2f"></span>领养宠物</div>' + cards("pets") +
      '<div class="section-title" style="margin-top:12px"><span class="bar" style="background:#06d6a0"></span>种植物</div>' + cards("plants");
  }

  function renderDress() {
    var G = window.GARDEN, st = G.state();
    var html = '<div class="section-title" style="margin-top:6px"><span class="bar" style="background:#e63999"></span>家园背景</div>' +
      '<div class="food-row" style="flex-wrap:wrap">' + G.SHOP.bg.map(function (b) {
        var owned = b.id === "meadow" || st.inv.bg.indexOf(b.id) !== -1;
        var active = st.home.bg === b.id;
        return '<button class="bg-chip' + (active ? " sel" : "") + '" data-bg="' + b.id + '" style="background:linear-gradient(' + b.sky + ',' + b.ground + ')">' +
          '<span style="font-size:20px">' + b.icon + '</span><span style="font-weight:700">' + b.name + '</span>' +
          '<span style="font-size:11px">' + (active ? "使用中" : (owned ? "点击使用" : b.cost + "分")) + '</span></button>';
      }).join("") + '</div>' +
      '<div class="section-title" style="margin-top:14px"><span class="bar" style="background:#e63999"></span>宠物配饰</div>' +
      G.SHOP.acc.map(function (a) {
        var owned = st.inv.acc.indexOf(a.id) !== -1;
        var afford = st.points >= a.cost;
        return '<div class="shop-card"><span class="sc-icon">' + a.icon + '</span>' +
          '<span style="flex:1"><span class="sc-name">' + a.name + '</span><br><span class="sc-desc">买后在「家园」点宠物给它戴上</span></span>' +
          (owned ? '<span class="sc-owned">已拥有</span>' :
            '<button class="btn sc-buy' + (afford ? '' : ' dis') + '" data-acc="' + a.id + '">' + a.cost + ' 分</button>') + '</div>';
      }).join("");
    return html;
  }

  function bindGarden(el) {
    var ck = el.querySelector("#checkinBtn");
    if (ck) ck.onclick = function () {
      var r = GARDEN.checkin();
      if (window.SND) r.ok ? SND.checkin() : SND.click();
      toast(r.msg);
      if (r.ok) { confettiBurst(); renderGardenHome(); }
    };
    $$(".hs-item", el).forEach(function (b) {
      b.onclick = function () { gardenSel = { kind: b.dataset.kind, id: b.dataset.id }; gardenBubble = null; if (window.SND) SND.click(); renderGardenHome(); };
    });
    $$("[data-food]", el).forEach(function (b) { b.onclick = function () { gardenFood = b.dataset.food; if (window.SND) SND.click(); renderGardenHome(); }; });
    $$("[data-eq]", el).forEach(function (b) { b.onclick = function () { GARDEN.equipAcc(gardenSel.id, b.dataset.eq); if (window.SND) SND.click(); renderGardenHome(); }; });
    var fb = el.querySelector("#feedBtn");
    if (fb) fb.onclick = function () {
      var r = GARDEN.feed(gardenSel.kind, gardenSel.id, gardenFood);
      toast(r.msg);
      if (r.ok) {
        gardenBubble = r.phrase;
        if (window.SND) r.leveled ? SND.levelup() : SND.feed();
        renderGardenHome();
        if (r.leveled) {
          confettiBurst();
          var emojiEl = document.querySelector('.hs-item[data-id="' + gardenSel.id + '"] .hs-emoji');
          if (emojiEl) emojiEl.classList.add("transform-flash");
          if (GARDEN.findOwned(gardenSel.kind, gardenSel.id).stage >= GARDEN.MAX_STAGE && window.SND) {
            setTimeout(function () { SND.transform(); confettiBurst(); toast("🎊 惊艳蜕变！" + GARDEN.displayName(gardenSel.kind, gardenSel.id) + " 长大成最终形态啦！"); }, 400);
          }
        }
        setTimeout(function () { gardenBubble = null; if (gardenTab === "home") renderGardenHome(); }, 2200);
      }
    };
    var ns = el.querySelector("#petNameSave");
    if (ns) ns.onclick = function () {
      var v = el.querySelector("#petNameInput").value.trim();
      GARDEN.setName(gardenSel.kind, gardenSel.id, v);
      if (window.SND) SND.click();
      toast(v ? "名字已保存：" + v : "已恢复原名");
      renderGardenHome();
    };
    $$(".sc-buy[data-kind]", el).forEach(function (b) {
      b.onclick = function () {
        if (b.classList.contains("dis")) { toast("积分还不够哦，先去学习攒积分吧～"); return; }
        var r = GARDEN.adopt(b.dataset.kind, b.dataset.id);
        if (window.SND) r.ok ? SND.adopt() : SND.click();
        toast(r.msg); if (r.ok) { confettiBurst(); renderGardenHome(); }
      };
    });
    $$("[data-acc]", el).forEach(function (b) {
      b.onclick = function () {
        if (b.classList.contains("dis")) { toast("积分还不够哦～"); return; }
        var r = GARDEN.buyAcc(b.dataset.acc); if (window.SND) SND.click(); toast(r.msg); if (r.ok) renderGardenHome();
      };
    });
    $$("[data-bg]", el).forEach(function (b) {
      b.onclick = function () {
        var id = b.dataset.bg, G = GARDEN;
        var owned = id === "meadow" || G.state().inv.bg.indexOf(id) !== -1;
        if (owned) { G.setBg(id); if (window.SND) SND.click(); toast("已切换到「" + G.findItem("bg", id).name + "」背景"); renderGardenHome(); }
        else { var r = G.buyBg(id); if (window.SND) SND.click(); toast(r.msg); if (r.ok) { G.setBg(id); renderGardenHome(); } }
      };
    });
    var be = el.querySelector("#backupExport");
    if (be) be.onclick = function () {
      var blob = new Blob([GARDEN.exportAll()], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "烧脑数学-学习备份.json";
      document.body.appendChild(a); a.click(); a.remove();
      toast("备份已导出，请保存好这个文件～");
    };
    var bi = el.querySelector("#backupImport");
    var bf = el.querySelector("#backupFile");
    if (bi && bf) {
      bi.onclick = function () { bf.click(); };
      bf.onchange = function () {
        var f = bf.files[0]; if (!f) return;
        var rd = new FileReader();
        rd.onload = function () {
          if (GARDEN.importAll(rd.result)) { toast("恢复成功！已载入备份的进度～"); renderGardenHome(); refreshUserBadge(); }
          else toast("这个备份文件读不了，换一个试试～");
        };
        rd.readAsText(f);
      };
    }
  }
  /* 小范围彩带（家园庆祝用） */
  function confettiBurst() { if (typeof confetti === "function") confetti(); }

  function renderReport() {
    var G = window.GARDEN, today = G.todayStats(), tot = G.totals();
    var days = G.lastDays(7);
    var maxSec = 1; days.forEach(function (d) { if (d.sec > maxSec) maxSec = d.sec; });
    var week = days.map(function (d) {
      var h = Math.round(d.sec / maxSec * 60);
      return '<div class="rp-day"><div class="rp-barwrap"><i style="height:' + h + 'px"></i></div>' +
        '<span class="rp-lb">' + d.label + '</span><span class="rp-v">' + (d.sec ? G.fmtTime(d.sec) : '—') + '</span></div>';
    }).join("");
    var totalQ = tot.correct + tot.wrong;
    var accPct = totalQ ? Math.round(tot.correct / totalQ * 100) : 0;
    return '<div class="section-title" style="margin-top:6px"><span class="bar" style="background:#3a86ff"></span>累计数据</div>' +
      '<div class="rp-grid">' +
      '<div class="rp-cell"><b>' + G.fmtTime(tot.sec) + '</b><span>累计学习时长</span></div>' +
      '<div class="rp-cell"><b>' + tot.sess + '</b><span>完成练习</span></div>' +
      '<div class="rp-cell"><b>' + tot.correct + '</b><span>答对题目</span></div>' +
      '<div class="rp-cell"><b>' + accPct + '%</b><span>总正确率</span></div>' +
      '<div class="rp-cell"><b>' + tot.checkinDays + '</b><span>打卡天数</span></div>' +
      '<div class="rp-cell"><b>' + tot.totalEarned + '</b><span>累计获得积分</span></div>' +
      '</div>' +
      '<div class="section-title" style="margin-top:14px"><span class="bar" style="background:#3a86ff"></span>近 7 天学习时长</div>' +
      '<div class="rp-week">' + week + '</div>' +
      '<div class="section-title" style="margin-top:14px"><span class="bar" style="background:#3a86ff"></span>今日</div>' +
      '<div class="card" style="font-size:13px;color:var(--ink-2)">学习 ' + G.fmtTime(today.sec) + ' · 练习 ' + today.sess + ' 次 · 答对 ' + today.correct + ' 题 · 获得积分 ' + today.earned + '/' + today.cap + '</div>' +
      renderLedger() + renderActivityTrail() + renderCalendar() +
      '<div class="section-title" style="margin-top:14px"><span class="bar" style="background:#a8a9b5"></span>数据备份（单机防丢）</div>' +
      '<div class="card" style="font-size:12.5px;color:var(--ink-2)">担心换设备或清缓存丢进度？导出备份存起来，需要时再恢复。</div>' +
      '<div style="display:flex;gap:10px;margin-top:10px">' +
      '<button class="btn ghost" id="backupExport" style="flex:1">📤 导出备份</button>' +
      '<button class="btn ghost" id="backupImport" style="flex:1">📥 恢复备份</button>' +
      '<input type="file" id="backupFile" accept=".json,application/json" style="display:none"></div>';
  }

  function renderLedger() {
    var G = window.GARDEN, ledger = G.state().ledger || [];
    if (!ledger.length) return '';
    function fmtTs(ts) { var d = new Date(ts); return (d.getMonth() + 1) + "/" + d.getDate() + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
    var rows = ledger.slice(0, 15).map(function (l) {
      var plus = l.n >= 0;
      return '<div class="act-row"><span style="flex:1"><span class="act-detail">' + l.reason + '</span><br>' +
        '<span class="act-time">' + fmtTs(l.ts) + '</span></span>' +
        '<span class="act-sec" style="color:' + (plus ? '#06a37c' : '#e85d04') + '">' + (plus ? '+' : '') + l.n + '</span></div>';
    }).join("");
    return '<div class="section-title" style="margin-top:14px"><span class="bar" style="background:#3a86ff"></span>积分明细（最近）</div>' +
      '<div class="card" style="padding:6px 12px">' + rows + '</div>';
  }

  function renderActivityTrail() {
    var G = window.GARDEN, acts = G.state().activities || [];
    if (!acts.length) return '<div class="section-title" style="margin-top:14px"><span class="bar" style="background:#3a86ff"></span>学习足迹</div><div class="card" style="font-size:13px;color:var(--ink-2)">还没有学习记录，去学一学、练一练或玩一把吧～</div>';
    function fmtTs(ts) { var d = new Date(ts); return (d.getMonth() + 1) + "/" + d.getDate() + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
    var rows = acts.slice(0, 20).map(function (a) {
      return '<div class="act-row"><span class="act-icon">' + (TYPE_ICON[a.type] || "📚") + '</span>' +
        '<span style="flex:1"><span class="act-detail">' + (TYPE_NAME_G[a.type] || a.type) + ' · ' + a.detail + '</span><br>' +
        '<span class="act-time">' + fmtTs(a.ts) + '</span></span>' +
        '<span class="act-sec">' + (a.sec ? G.fmtTime(a.sec) : '浏览') + '</span></div>';
    }).join("");
    return '<div class="section-title" style="margin-top:14px"><span class="bar" style="background:#3a86ff"></span>学习足迹（看了哪些 / 玩了哪些 / 停留多久）</div>' +
      '<div class="card" style="padding:6px 12px">' + rows + '</div>';
  }

  function renderCalendar() {
    var G = window.GARDEN, checked = G.checkedDays();
    var now = new Date(), y = now.getFullYear(), m = now.getMonth();
    var first = new Date(y, m, 1).getDay();
    var daysIn = new Date(y, m + 1, 0).getDate();
    var cells = "";
    for (var i = 0; i < first; i++) cells += '<span class="cal-cell blank"></span>';
    for (var d = 1; d <= daysIn; d++) {
      var k = y + "-" + String(m + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");
      var isToday = d === now.getDate();
      cells += '<span class="cal-cell' + (checked[k] ? " on" : "") + (isToday ? " today" : "") + '">' + d + (checked[k] ? "✓" : "") + '</span>';
    }
    return '<div class="section-title" style="margin-top:14px"><span class="bar" style="background:#3a86ff"></span>本月打卡日历</div>' +
      '<div class="card"><div class="cal-head"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>' +
      '<div class="cal-grid">' + cells + '</div>' +
      '<div style="font-size:11px;color:#a8a9b5;margin-top:8px">学习打卡的日子会点亮 ✓，坚持就有收获～</div></div>';
  }
  /* =====================================================
   * 用户门（创建 / 选择学习者，积分按用户永久保存）
   * ===================================================== */
  var ugSelAvatar = "🦊";
  var UG_AVATARS = ["🦊", "🐼", "🐰", "🐯", "🦁", "🐨", "🐸", "🦄", "🐙", "🐧"];
  function initUserGate() {
    $("#ugAvatars").innerHTML = UG_AVATARS.map(function (a) {
      return '<button class="ug-av' + (a === ugSelAvatar ? ' sel' : '') + '" data-av="' + a + '">' + a + '</button>';
    }).join("");
    $$("#ugAvatars .ug-av").forEach(function (b) {
      b.onclick = function () { ugSelAvatar = b.dataset.av; $$("#ugAvatars .ug-av").forEach(function (x) { x.classList.toggle("sel", x === b); }); };
    });
    renderUserList();
    $("#ugCreate").onclick = function () {
      var name = $("#ugName").value.trim() || "小学员";
      GARDEN.createUser(name, ugSelAvatar);
      if (window.SND) SND.adopt();
      enterApp();
    };
  }
  function renderUserList() {
    var us = GARDEN.listUsers();
    $("#ugList").innerHTML = us.length ? us.map(function (u) {
      return '<div class="ug-user" data-uid="' + u.id + '"><span class="ugu-av">' + u.avatar + '</span>' +
        '<span style="flex:1"><span class="ugu-name">' + esc(u.name) + '</span><br><span class="ugu-meta">点击继续 TA 的学习进度</span></span><span style="color:#ffb703">›</span></div>';
    }).join("") : '';
    $$("#ugList .ug-user").forEach(function (el) {
      el.onclick = function () { GARDEN.switchUser(el.dataset.uid); if (window.SND) SND.click(); enterApp(); };
    });
  }
  function enterApp() {
    $("#userGate").classList.add("hidden");
    refreshUserBadge();
    var savedTab = null; try { savedTab = localStorage.getItem("snmath_tab"); } catch (e) {}
    if (savedTab && tabPages[savedTab] && savedTab !== "home") switchTab(savedTab); else switchTab("home");
  }
  function openUserGate() { renderUserList(); $("#userGate").classList.remove("hidden"); }
  function refreshUserBadge() {
    var u = GARDEN.activeUser();
    var btn = $("#btnUser");
    if (btn) { btn.textContent = u ? u.avatar : "🦊"; btn.title = u ? ("当前：" + u.name + "（点击切换）") : "选择用户"; }
  }

  /* ---------- 启动 ---------- */
  $("#verTag").textContent = "v" + MD.version;
  initSelectors();
  initUserGate();
  if (window.SCRATCH) SCRATCH.init();
  $("#btnUser").onclick = openUserGate;
  if (window.SND) { document.addEventListener("pointerdown", function once() { SND.unlock(); document.removeEventListener("pointerdown", once); }); }
  if (GARDEN.activeUser()) {
    enterApp(); /* 内部会恢复上次页签 */
  } else {
    $("#userGate").classList.remove("hidden");
  }
})();
</script>
</body></html>
