window.GARDEN = (function () {
  var USERS_KEY = "snmath_users_v1";
  var ACTIVE_KEY = "snmath_active_user_v1";
  var DATA_PREFIX = "snmath_garden_u_";
  var DAILY_CAP = 40;       /* 每日积分上限（防沉迷） */
  var STAGE_NUT = 30;       /* 每升一阶所需营养 */
  var CHECKIN_BONUS = 2;    /* 每日打卡加分 */

  function dayKey(d) {
    d = d || new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function r1(x) { return Math.round(x * 10) / 10; }

  /* ---------- 用户管理 ---------- */
  function listUsers() { try { var u = JSON.parse(localStorage.getItem(USERS_KEY) || "[]"); return Array.isArray(u) ? u : []; } catch (e) { return []; } }
  function saveUsers(u) { try { localStorage.setItem(USERS_KEY, JSON.stringify(u)); } catch (e) {} }
  function activeUserId() { try { return localStorage.getItem(ACTIVE_KEY) || ""; } catch (e) { return ""; } }
  function activeUser() {
    var id = activeUserId(), us = listUsers();
    for (var i = 0; i < us.length; i++) if (us[i].id === id) return us[i];
    return null;
  }
  function createUser(name, avatar) {
    var us = listUsers();
    var u = { id: "u" + Date.now().toString(36) + Math.floor(Math.random() * 1000), name: name || "小学员", avatar: avatar || "🦊", createdAt: Date.now() };
    us.push(u); saveUsers(us);
    try { localStorage.setItem(ACTIVE_KEY, u.id); } catch (e) {}
    state = defaultState(); save(state);
    return u;
  }
  function switchUser(id) { try { localStorage.setItem(ACTIVE_KEY, id); } catch (e) {} state = load(); }
  function deleteUser(id) {
    var us = listUsers().filter(function (u) { return u.id !== id; });
    saveUsers(us);
    try { localStorage.removeItem(DATA_PREFIX + id); } catch (e) {}
    if (activeUserId() === id) {
      if (us.length) { try { localStorage.setItem(ACTIVE_KEY, us[0].id); } catch (e) {} state = load(); }
      else { try { localStorage.removeItem(ACTIVE_KEY); } catch (e) {} state = defaultState(); }
    }
  }

  /* ---------- 家园数据 ---------- */
  function defaultState() {
    return {
      points: 0, totalEarned: 0,
      earnedByDay: {}, secByDay: {}, sessByDay: {}, correctByDay: {}, wrongByDay: {}, checkinByDay: {},
      owned: [], medals: [],
      activities: [], ledger: [], startedAt: Date.now()
    };
  }
  function dataKey() { return DATA_PREFIX + (activeUserId() || "guest"); }
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(dataKey()) || "null");
      if (!s) return defaultState();
      var d = defaultState();
      for (var k in d) if (!(k in s)) s[k] = d[k];
      /* 旧版 home.pets/plants 迁移到 owned */
      if (s.home && !s.owned.length) {
        (s.home.pets || []).forEach(function (p) { s.owned.push({ id: p.id, stage: p.stage || 0, nut: 0, nick: p.nick || "", acc: p.acc || null }); });
        (s.home.plants || []).forEach(function (p) { s.owned.push({ id: p.id, stage: p.stage || 0, nut: 0, nick: p.nick || "", acc: null }); });
      }
      return s;
    } catch (e) { return defaultState(); }
  }
  function save(s) { try { localStorage.setItem(dataKey(), JSON.stringify(s)); } catch (e) {} }
  var state = load();

  function norm(s) { return String(s == null ? "" : s).replace(/\s+/g, "").toLowerCase(); }
  function store(key, val) {
    try {
      if (val === undefined) return JSON.parse(localStorage.getItem(key) || "null");

  }

  function findUnitMeta(uid) {

    for (var i = 0; i < keys.length; i++) {

  function startTestSession() {
    var units = currentBook().units;
    var grade = currentBook().grade;
    var qs = [];
    /* 混入本年级真题（最多 5 道） */
    if (window.REALBANK && REALBANK[grade]) {
      var rb = REALBANK[grade].slice();
      var nReal = Math.min(5, rb.length);
      for (var r = 0; r < nReal; r++) {
        var ri = Math.floor(Math.random() * rb.length);
        qs.push(rb.splice(ri, 1)[0]);
      }
    }
    while (qs.length < 20) {
      var u = QE.pick(units);
      var t = QE.pick(QE.unitTypes(u.id));
      var q = QE.make(u.id, t);
      if (q) qs.push(q);
    }
    startSession({ title: currentBook().label + " · 综合测试（含真题）", unit: "all", questions: qs });
  }

    var qs = LIFE.session(10).map(function (q) { q.type = q.type || "yingyong"; return q; });

  /* 课外延伸：常考应用题型 */
  function startExtensionSession() {
    var qs = [], seen = {};
    var guard = 0;
    while (qs.length < 12 && guard < 200) {
      guard++;
      var q = EXTEND.gen();
      var key = q.q.replace(/\d+/g, "#");
      if (seen[key]) continue;
      seen[key] = 1;
      qs.push(q);
    }
    startSession({ title: "课外延伸 · 常考应用题", unit: null, questions: qs });
  }

  function startSession(cfg) {
    cfg.idx = 0; cfg.correct = 0; cfg.total = cfg.questions.length;
    cfg.newWrong = 0;
    cfg.startTs = Date.now();
    if (window.SCRATCH) SCRATCH.show();
    if (window.GARDEN) GARDEN.startActivity("practice", cfg.title || "练习");
    session = cfg;
    ["practiceHome", "practiceSetup", "practiceResult"].forEach(function (id) { $("#" + id).classList.add("hidden"); });
    $("#practiceSession").classList.remove("hidden");
    if (cfg.timed) {
      cfg.left = cfg.timed;
      cfg.timer = setInterval(function () {
        cfg.left--;
        var t = $("#sessTimer");
        if (t) t.textContent = cfg.left;
        if (cfg.left <= 0) { clearInterval(cfg.timer); endSession(); }
      }, 1000);
    }
    renderQuestion();
  }

  function renderQuestion() {
    var cfg = session, q = cfg.questions[cfg.idx];
    var el = $("#practiceSession");
    var tagCls = { kousuan: "tt-kousuan", tuoshi: "tt-tuoshi", shushi: "tt-shushi", tiankong: "tt-tiankong", xuanze: "tt-xuanze", panduan: "tt-panduan", yingyong: "tt-yingyong", guilv: "tt-guilk", dubiao: "tt-tiankong", guancha: "tt-panduan" };
    var html = '<div class="back-row"><button class="back-btn" id="exitSess">‹</button>' +
      '<div class="page-title">' + esc(cfg.title) + '</div>' +
      (cfg.timed ? '<span class="chip blue">⏱ <b id="sessTimer">' + cfg.left + '</b>s</span>' : '') + '</div>' +
      '<div class="progress-bar"><i style="width:' + (cfg.idx / cfg.total * 100) + '%"></i></div>' +
      '<div class="qcard"><div class="q-top">' +
      '<span class="q-type-tag ' + (tagCls[q.type] || "tt-tiankong") + '">' + (QE.TYPE_NAME[q.type] || q.type) + '</span>' +
      '<span class="q-progress">' + (cfg.idx + 1) + ' / ' + cfg.total + '</span></div>' +
      '<div class="q-text">' + q.q + '</div>';

    if (q.input === "choice") {
      var letters = ["A", "B", "C", "D"];
      html += '<div class="opt-list">' + q.options.map(function (o, i) {
        return '<button class="opt-btn" data-opt="' + esc(o) + '"><span class="opt-letter">' + letters[i] + '</span><span>' + esc(o) + '</span></button>';
      }).join("") + '</div>';
    } else if (q.input === "choiceHtml") {
      html += '<div class="opt-grid">' + q.optHtml.map(function (h, i) {
        return '<button class="opt-cell" data-idx="' + i + '">' + h + '</button>';
      }).join("") + '</div>';
    } else if (q.input === "judge") {
      html += '<div class="judge-row"><button class="judge-btn" data-j="对">✔ 对</button><button class="judge-btn" data-j="错">✘ 错</button></div>';
    } else {
      var _ns = /[^\d.\-]/.test(String(q.ans)) || (q.accept || []).some(function (a) { return /[^\d.\-]/.test(String(a)); });
      html += '<input class="answer-input" id="ansInput" placeholder="在这里写答案" autocomplete="off" inputmode="' + ((q.input === "num" && !_ns) ? "decimal" : "text") + '">';
    }
    html += '<div class="feedback" id="fb"></div>' +
      '<div style="margin-top:14px;display:flex;gap:10px">' +
      '<button class="btn block" id="btnCheck">✅ 提交答案</button>' +
      '<button class="btn block hidden" id="btnNext">下一题 →</button></div></div>';
    el.innerHTML = html;

    $("#exitSess").onclick = function () {
      if (session && session.timer) clearInterval(session.timer);
      if (window.SCRATCH) SCRATCH.hide();
      renderPracticeHome();
    };

    var answered = false, userAns = null;

    $$(".opt-btn", el).forEach(function (b) {
      b.onclick = function () {
        if (answered) return;
        $$(".opt-btn", el).forEach(function (x) { x.classList.remove("sel"); });
        b.classList.add("sel");
        userAns = b.dataset.opt;
      };
    });
    $$(".opt-cell", el).forEach(function (b) {
      b.onclick = function () {
        if (answered) return;
        $$(".opt-cell", el).forEach(function (x) { x.classList.remove("sel"); });
        b.classList.add("sel");
        userAns = b.dataset.idx;
      };
    });
    $$(".judge-btn", el).forEach(function (b) {
      b.onclick = function () {
        if (answered) return;
        $$(".judge-btn", el).forEach(function (x) { x.classList.remove("sel"); });
        b.classList.add("sel");
        userAns = b.dataset.j;
      };
    });
    var inp = $("#ansInput", el);
    if (inp) inp.onkeydown = function (e) { if (e.key === "Enter") $("#btnCheck").click(); };

    $("#btnCheck").onclick = function () {
      if (answered) return;
      var val;
      if (q.input === "choice" || q.input === "judge" || q.input === "choiceHtml") val = userAns;
      else val = inp ? inp.value.trim() : "";
      if (val === "" || val == null) { toast("先写个答案再提交哦～"); return; }
      answered = true;
      cfg.done = (cfg.done || 0) + 1;

      var ok = checkAnswer(q, val);
      if (window.SND) ok ? SND.correct() : SND.wrong();
      if (ok) { cfg.correct++; if (window.GARDEN) GARDEN.addPoints(0.5, "答对一题"); }
      else {
        // 收录错题
        var meta = findUnitMeta(q.unit);
        if (meta) {
          WB.add(q, {
            book: meta.book.key, bookLabel: meta.book.label,
            unitTitle: "第" + meta.unit.num + "单元 " + meta.unit.title,
            typeName: QE.TYPE_NAME[q.type] || q.type
          });
          cfg.newWrong++;
        }
        if (window.GARDEN) GARDEN.deductPoints(0.3, "答错题");
      }
      var whyWrong = "";
      if (!ok) {
        whyWrong = q.explain ? q.explain : ("正确答案是 " + showAns(q) + "，再想想这类题的方法～");
      }
      var fb = $("#fb");
      fb.className = "feedback show " + (ok ? "ok" : "no");
      fb.innerHTML = '<div class="fb-title">' + (ok ? "🎉 回答正确！" : "❌ 再想想～ 正确答案是：" + showAns(q) + (metaOf(q) ? "<br><span style='font-size:12px;color:#8a4b0f'>已放进错题本，之后可以举一反三巩固它 📒</span>" : "")) + '</div>' +
        (whyWrong ? '<div class="fb-why">💡 为什么：' + whyWrong + '</div>' : (q.explain ? '<div class="fb-exp">📖 ' + q.explain + '</div>' : ''));
      $$(".opt-btn", el).forEach(function (b) {
        if (norm(b.dataset.opt) === norm(q.ans)) b.classList.add("correct");
        else if (b.classList.contains("sel") && !ok) b.classList.add("wrong");
        b.disabled = true;
      });
      $$(".opt-cell", el).forEach(function (b) {
        if (b.dataset.idx === String(q.ans)) b.classList.add("correct");
        else if (b.classList.contains("sel") && !ok) b.classList.add("wrong");
        b.disabled = true;
      });
      $$(".judge-btn", el).forEach(function (b) {
        if (b.dataset.j === q.ans) b.classList.add("correct");
        else if (b.classList.contains("sel") && !ok) b.classList.add("wrong");
        b.disabled = true;
      });
      if (inp) inp.disabled = true;
      $("#btnCheck").classList.add("hidden");
      $("#btnNext").classList.remove("hidden");
    };

    $("#btnNext").onclick = function () {
      cfg.idx++;
      if (cfg.idx >= cfg.total) endSession();
      else renderQuestion();
    };
  }
  function metaOf(q) { return q.unit ? findUnitMeta(q.unit) : null; }

  function checkAnswer(q, val) {
    if (q.input === "choiceHtml") return norm(val) === norm(q.ans);
    var list = [q.ans];
    if (q.accept) list = list.concat(q.accept);
    if (q.input === "num") {
      var v = parseFloat(String(val).replace(/[元角分米厘米个本棵人千米克吨支平方]/g, ""));
      for (var i = 0; i < list.length; i++) {
        var a = parseFloat(list[i]);
        if (!isNaN(a) && !isNaN(v) && Math.abs(a - v) < 0.001) return true;
        if (norm(list[i]) === norm(val)) return true;
      }
      return false;
    }
    for (var j = 0; j < list.length; j++) {
      if (norm(list[j]) === norm(val)) return true;
    }
    return false;
  }
  function showAns(q) {
    if (q.input === "choiceHtml") return "图中正确的那个形状";
    return esc(q.ans);
  }

  function endSession() {
    var cfg = session;
    if (cfg.timer) clearInterval(cfg.timer);

    ["practiceHome", "practiceSetup", "practiceSession"].forEach(function (id) { $("#" + id).classList.add("hidden"); });
    var el = $("#practiceResult");
    el.classList.remove("hidden");
    var denom = cfg.timed ? (cfg.done || cfg.correct || 1) : cfg.total;
    var acc = denom ? Math.round(cfg.correct / denom * 100) : 0;
    var stars = acc >= 90 ? 3 : (acc >= 70 ? 2 : (acc >= 50 ? 1 : 0));

    /* 学习时长 + 积分（自主学习自动累积） */
    var earnedBonus = 0;
    if (window.GARDEN && cfg.startTs) {
      GARDEN.endActivity();
      GARDEN.addStudy((Date.now() - cfg.startTs) / 1000);
      GARDEN.addSession(cfg.correct, cfg.total);
      var bonus = acc >= 100 ? 1.5 : (acc >= 60 ? 1 : 0.5);
      earnedBonus = GARDEN.addPoints(bonus, "完成练习");
    }

    /* 举一反三巩固结果判定 */
    var similarNote = "";
    if (cfg.similar) {
      if (acc === 100) {
        WB.master(cfg.similar);
        similarNote = '<div class="kbox tip" style="text-align:left">🏅 三道同类题全部答对，这道错题已经掌握，移出待巩固列表！</div>';
      } else {

      }
    }

    var msg = stars === 3 ? "太厉害了！知识点完全掌握！🏆" :
      stars === 2 ? "很不错！再练练就能拿满星啦！" :
      stars === 1 ? "继续加油！回到学一学复习一下再来！" :
      "没关系，我们回去把知识点再看一遍，一定行！";
    if (cfg.unit && cfg.unit !== "all" && !cfg.similar) {
      var old = progress[cfg.unit];
      if (!old || acc > old.acc) progress[cfg.unit] = { acc: acc, stars: Math.max(stars, old ? old.stars : 0) };
      saveProgress();
    }
    el.innerHTML = '<div class="result-card">' +
      '<div style="font-size:14px;color:var(--ink-2);font-weight:700">' + esc(cfg.title) + ' · 完成！</div>' +
      '<div class="result-stars">' + "⭐".repeat(stars) + "☆".repeat(3 - stars) + '</div>' +
      '<div class="result-score">' + acc + '<span style="font-size:20px">%</span></div>' +
      '<div style="font-size:13px;color:var(--ink-2)">答对 ' + cfg.correct + ' 题' + (cfg.timed ? '（共作答 ' + denom + ' 题）' : ' / 共 ' + cfg.total + ' 题') + '</div>' +
      '<div class="result-msg">' + msg + '</div>' +
      (earnedBonus > 0 ? '<div class="kbox tip" style="text-align:left">🌟 自主学习奖励：+' + earnedBonus + ' 积分（可去家园领养宠物、种植物）</div>' : '') +
      (cfg.newWrong > 0 && !cfg.similar ? '<div class="kbox warn" style="text-align:left">📒 本次新增 ' + cfg.newWrong + ' 道错题，已放进错题本</div>' : '') +
      similarNote +
      '<div class="result-btns" style="margin-top:12px">' +
      '<button class="btn ghost" id="rBack">' + (cfg.similar ? "返回错题本" : "返回练习") + '</button>' +
      '<button class="btn" id="rAgain">再来一次</button></div></div>';
    $("#rBack").onclick = cfg.similar ? renderWrongBook : renderPracticeHome;
    $("#rAgain").onclick = function () {
      if (cfg.similar) {
        var entry = null;
        WB.all().forEach(function (e) { if (e.id === cfg.similar) entry = e; });

        else renderWrongBook();
      } else if (cfg.unit && cfg.unit !== "all") openPracticeSetup(cfg.unit);
      else if (cfg.timed) startQuickSession();

    };

  }

      } else {
        var _needSym = /[^\d.\-]/.test(String(q.ans)) || (q.accept || []).some(function (a) { return /[^\d.\-]/.test(String(a)); });
        inputHtml = '<input class="answer-input" id="ansInput" placeholder="在这里写答案" autocomplete="off" inputmode="' + ((q.input === "num" && !_needSym) ? "decimal" : "text") + '">';
      }
      el.innerHTML =
        '<div class="back-row"><button class="back-btn" id="thinkSessBack">‹</button><div class="page-title">' + t.icon + ' ' + esc(t.name) + '闯关</div></div>' +
        '<div class="progress-bar"><i style="width:' + (idx / qs.length * 100) + '%"></i></div>' +
        '<div class="qcard"><div class="q-top"><span class="q-type-tag tt-xuanze">思维题</span><span class="q-progress">' + (idx + 1) + ' / ' + qs.length + '</span></div>' +
        '<div class="q-text">' + q.q + '</div>' + inputHtml +
        '<div class="feedback" id="fb"></div>' +
        '<div style="margin-top:14px;display:flex;gap:10px">' +
        '<button class="btn block" id="btnCheck">✅ 提交答案</button>' +
        '<button class="btn block hidden" id="btnNext">下一题 →</button></div></div>';
      $("#thinkSessBack").onclick = function () { if (window.SCRATCH) SCRATCH.hide(); openThinkTopic(t.id); };
      var answered = false, userAns = null;
      $$(".opt-btn", el).forEach(function (b) { b.onclick = function () { if (answered) return; $$(".opt-btn", el).forEach(function (x) { x.classList.remove("sel"); }); b.classList.add("sel"); userAns = b.dataset.opt; }; });
      var inp = $("#ansInput", el);
      if (inp) inp.onkeydown = function (e) { if (e.key === "Enter") $("#btnCheck").click(); };
      $("#btnCheck").onclick = function () {
        if (answered) return;
        var val = q.input === "choice" ? userAns : (inp ? inp.value.trim() : "");
        if (val === "" || val == null) { toast("先写个答案再提交哦～"); return; }
        answered = true;
        var accepts = [q.ans].concat(q.accept || []);
        var ok = accepts.some(function (a) { return norm(a) === norm(val); });
        if (window.SND) ok ? SND.correct() : SND.wrong();
        if (ok) { correct++; if (window.GARDEN) GARDEN.addPoints(0.5, "思维答对"); }
        else if (window.GARDEN) { GARDEN.deductPoints(0.3, "思维答错"); }
        var fb = $("#fb");
        fb.className = "feedback show " + (ok ? "ok" : "no");
        fb.innerHTML = '<div class="fb-title">' + (ok ? "🎉 回答正确！" : "❌ 再想想～ 正确答案是：" + esc(q.ans)) + '</div>' +
          (q.explain ? '<div class="fb-exp">💡 ' + esc(q.explain) + '</div>' : '');
        $$(".opt-btn", el).forEach(function (b) { if (norm(b.dataset.opt) === norm(q.ans)) b.classList.add("correct"); b.disabled = true; });
        if (inp) inp.disabled = true;
        $("#btnCheck").classList.add("hidden");
        $("#btnNext").classList.remove("hidden");
      };
      $("#btnNext").onclick = function () {
        idx++;
        if (idx >= qs.length) showResult();
        else showQ();
      };
    }
    function showResult() {
      var acc = Math.round(correct / qs.length * 100);
      var stars = acc >= 90 ? 3 : (acc >= 70 ? 2 : (acc >= 50 ? 1 : 0));
      var thinkBonus = 0;
      if (window.GARDEN) {
        GARDEN.endActivity();
        GARDEN.addStudy((Date.now() - thinkStartTs) / 1000);
        GARDEN.addSession(correct, qs.length);
        thinkBonus = GARDEN.addPoints(acc >= 100 ? 2 : (acc >= 60 ? 1.5 : 1), "思维闯关");
      }
      var msg = stars === 3 ? "思维小达人，太棒了！🏆" : (stars === 2 ? "很不错，再接再厉！" : (stars === 1 ? "继续加油，多练练方法！" : "别灰心，回去看看方法讲解吧！"));
      el.innerHTML = '<div class="result-card">' +
        '<div style="font-size:14px;color:var(--ink-2);font-weight:700">' + t.icon + ' ' + esc(t.name) + ' · 闯关完成</div>' +
        '<div class="result-stars">' + "⭐".repeat(stars) + "☆".repeat(3 - stars) + '</div>' +
        '<div class="result-score">' + acc + '<span style="font-size:20px">%</span></div>' +
        '<div style="font-size:13px;color:var(--ink-2)">答对 ' + correct + ' 题 / 共 ' + qs.length + ' 题</div>' +
        '<div class="result-msg">' + msg + '</div>' +
        (thinkBonus > 0 ? '<div class="kbox tip" style="text-align:left">🌟 +' + thinkBonus + ' 积分</div>' : '') +
        '<div class="result-btns" style="margin-top:12px">' +
        '<button class="btn ghost" id="rBack">返回思维营</button>' +
        '<button class="btn" id="rAgain">再闯一次</button></div></div>';
      $("#rBack").onclick = function () { openThinkTopic(t.id); };
      $("#rAgain").onclick = function () { startThinkSession(t); };
    }
    showQ();
  }

  /* 下载离线版（联网时把当前页面存成文件） */
  function downloadOffline() {
    function doDownload(htmlText) {
      var blob = new Blob([htmlText], { type: "text/html;charset=utf-8" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "烧脑数学-离线版.html";
      document.body.appendChild(a); a.click(); a.remove();
      toast("离线版已下载，断网也能打开玩～");
    }
    if (location.protocol === "http:" || location.protocol === "https:") {
      fetch(location.href).then(function (r) { return r.text(); }).then(doDownload)
        .catch(function () { doDownload("<!DOCTYPE html>" + document.documentElement.outerHTML); });
    } else {
      doDownload("<!DOCTYPE html>" + document.documentElement.outerHTML);
    }
  }

          '<div class="ac-icon">' + icon + '</div>' +
          '<div class="ac-name">' + esc(it.name) + '</div>' +
          '<div class="ac-tag">' + (it.kind === "pet" ? "动物" : it.kind === "tree" ? "树木" : "花草") + '</div>' +
          (owned ? '<div class="ac-cost owned-tag">已领养 ✓</div>' : '<div class="ac-cost' + (afford ? '' : ' noafford') + '">🔒 ' + it.cost + ' 积分</div>') +
          '</div>';
      });
      h += '</div>';
    });
    return h;
  }

  /* ---------- 勋章墙 ---------- */
  function renderMedalWall() {
    var G = window.GARDEN;
    var t = G.totals();
    var h = '<div class="card" style="font-size:12.5px;color:var(--ink-2)">把学习坚持下来，养成小动物，点亮属于你的勋章！已获得 <b style="color:#ff9f43">' + t.medals + '</b> / ' + G.MEDALS.length + ' 枚。</div>';
    h += '<div class="medal-grid">';
    G.MEDALS.forEach(function (m) {
      var got = G.hasMedal(m.id);
      h += '<div class="medal-card' + (got ? " got" : "") + '">' +
        '<div class="md-icon">' + (got ? m.icon : "🔒") + '</div>' +
        '<div class="md-name">' + esc(m.name) + '</div>' +
        '<div class="md-desc">' + esc(m.desc) + '</div>' +
        (got ? '<div class="md-got">已获得 🎉</div>' : '<div class="md-lock">未点亮</div>') +
        '</div>';
    });
    h += '</div>';
    return h;
  }

  /* ---------- 报告 ---------- */
  function renderReport() {
    var G = window.GARDEN, today = G.todayStats(), tot = G.totals();
    var days = G.lastDays(7);
    var maxSec = 1; days.forEach(function (d) { if (d.sec > maxSec) maxSec = d.sec; });
    var week = days.map(function (d) {
      var hh = Math.round(d.sec / maxSec * 60);
      return '<div class="rp-day"><div class="rp-barwrap"><i style="height:' + hh + 'px"></i></div>' +
        '<span class="rp-lb">' + d.label + '</span><span class="rp-v">' + (d.sec ? G.fmtTime(d.sec) : '—') + '</span></div>';
    }).join("");
    var totalQ = tot.correct + tot.wrong;
    var accPct = totalQ ? Math.round(tot.correct / totalQ * 100) : 0;
    var html = '<div class="section-title" style="margin-top:6px"><span class="bar" style="background:#3a86ff"></span>累计数据</div>' +
      '<div class="rp-grid">' +
      '<div class="rp-cell"><b>' + G.fmtTime(tot.sec) + '</b><span>累计学习时长</span></div>' +
      '<div class="rp-cell"><b>' + tot.sess + '</b><span>完成练习</span></div>' +
      '<div class="rp-cell"><b>' + tot.correct + '</b><span>答对题目</span></div>' +
      '<div class="rp-cell"><b>' + accPct + '%</b><span>总正确率</span></div>' +
      '<div class="rp-cell"><b>' + tot.checkinDays + '</b><span>打卡天数</span></div>' +
      '<div class="rp-cell"><b>' + tot.totalEarned + '</b><span>累计获得积分</span></div>' +
      '<div class="rp-cell"><b>' + tot.owned + '</b><span>已领养</span></div>' +
      '<div class="rp-cell"><b>' + tot.maxed + '</b><span>已养大</span></div>' +
      '<div class="rp-cell"><b>' + tot.medals + '</b><span>勋章</span></div>' +
      '</div>' +
      '<div class="section-title" style="margin-top:14px"><span class="bar" style="background:#3a86ff"></span>近 7 天学习时长</div>' +
      '<div class="rp-week">' + week + '</div>' +
      '<div class="section-title" style="margin-top:14px"><span class="bar" style="background:#3a86ff"></span>今日</div>' +
      '<div class="card" style="font-size:13px;color:var(--ink-2)">学习 ' + G.fmtTime(today.sec) + ' · 练习 ' + today.sess + ' 次 · 答对 ' + today.correct + ' 题 · 获得积分 ' + today.earned + '/' + today.cap + '</div>' +
      '<div class="section-title" style="margin-top:14px"><span class="bar" style="background:#06d6a0"></span>积分从哪来（每日上限 ' + G.DAILY_CAP + ' 分）</div>' +
      '<div class="card" style="font-size:12.5px;color:var(--ink-2);line-height:1.9">' +
      '✅ 答对一题 <b>+0.5</b> · 完成练习 <b>+0.5~1.5</b><br>' +
      '🧩 思维闯关 <b>+1~2</b> · 完成游戏 <b>+0.5~1</b><br>' +
      '📖 学知识点 <b>+0.5</b> · 每日打卡 <b>+' + G.CHECKIN_BONUS + '</b><br>' +
      '💡 一周约可攒 <b>' + (G.DAILY_CAP * 7) + '</b> 分，刚好养大一只小动物（约 260 分）</div>' +
      renderLedger() + renderActivityTrail() + renderCalendar() +
      '<div class="section-title" style="margin-top:14px"><span class="bar" style="background:#a8a9b5"></span>离线与备份</div>' +
      '<div style="display:flex;gap:10px">' +
      '<button class="btn ghost" id="dlOffline" style="flex:1">📥 下载离线版</button>' +
      '<button class="btn ghost" id="backupExport" style="flex:1">📤 导出备份</button>' +
      '<button class="btn ghost" id="backupImport" style="flex:1">📥 恢复备份</button>' +
      '<input type="file" id="backupFile" accept=".json,application/json" style="display:none"></div>' +
      '<div class="card" style="font-size:11.5px;color:#a8a9b5;margin-top:8px">联网时点「下载离线版」保存到手机，断网也能玩；进度在本机浏览器保存，换设备可用备份迁移。</div>';
    return html;
  }

  function renderLedger() {
    var G = window.GARDEN, ledger = G.state().ledger || [];
    if (!ledger.length) return '';
    function fmtTs(ts) { var d = new Date(ts); return (d.getMonth() + 1) + "/" + d.getDate() + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
    var rows = ledger.slice(0, 15).map(function (l) {
      var plus = l.n >= 0;
      return '<div class="act-row"><span style="flex:1"><span class="act-detail">' + l.reason + '</span><br>' +
        '<span class="act-time">' + fmtTs(l.ts) + '</span></span>' +
        '<span class="act-sec" style="color:' + (plus ? '#06a37c' : '#e85d04') + '">' + (plus ? '+' : '') + l.n + '</span></div>';
    }).join("");
    return '<div class="section-title" style="margin-top:14px"><span class="bar" style="background:#3a86ff"></span>积分明细（最近）</div>' +
      '<div class="card" style="padding:6px 12px">' + rows + '</div>';
  }

  function renderActivityTrail() {
    var G = window.GARDEN, acts = G.state().activities || [];
    if (!acts.length) return '';
    function fmtTs(ts) { var d = new Date(ts); return (d.getMonth() + 1) + "/" + d.getDate() + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
    var rows = acts.slice(0, 20).map(function (a) {
      return '<div class="act-row"><span class="act-icon">' + (TYPE_ICON[a.type] || "📚") + '</span>' +
        '<span style="flex:1"><span class="act-detail">' + (TYPE_NAME_G[a.type] || a.type) + ' · ' + a.detail + '</span><br>' +
        '<span class="act-time">' + fmtTs(a.ts) + '</span></span>' +
        '<span class="act-sec">' + (a.sec ? G.fmtTime(a.sec) : '浏览') + '</span></div>';
    }).join("");
    return '<div class="section-title" style="margin-top:14px"><span class="bar" style="background:#3a86ff"></span>学习足迹（看了哪些 / 玩了哪些 / 停留多久）</div>' +
      '<div class="card" style="padding:6px 12px">' + rows + '</div>';
  }

  function renderCalendar() {
    var G = window.GARDEN, checked = G.checkedDays();
    var now = new Date(), y = now.getFullYear(), m = now.getMonth();
    var first = new Date(y, m, 1).getDay();
    var daysIn = new Date(y, m + 1, 0).getDate();
    var cells = "";
    for (var i = 0; i < first; i++) cells += '<span class="cal-cell blank"></span>';
    for (var d = 1; d <= daysIn; d++) {
      var k = y + "-" + String(m + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");
      var isToday = d === now.getDate();
      cells += '<span class="cal-cell' + (checked[k] ? " on" : "") + (isToday ? " today" : "") + '">' + d + (checked[k] ? "✓" : "") + '</span>';
    }
    return '<div class="section-title" style="margin-top:14px"><span class="bar" style="background:#3a86ff"></span>本月打卡日历</div>' +
      '<div class="card"><div class="cal-head"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>' +
      '<div class="cal-grid">' + cells + '</div>' +
      '<div style="font-size:11px;color:#a8a9b5;margin-top:8px">学习打卡的日子会点亮 ✓，坚持就有收获～</div></div>';
  }
  /* =====================================================
   * 用户门（创建 / 选择学习者，积分按用户永久保存）
   * ===================================================== */
  var ugSelAvatar = "🦊";
  var UG_AVATARS = ["🦊", "🐼", "🐰", "🐯", "🦁", "🐨", "🐸", "🦄", "🐙", "🐧"];
  function initUserGate() {
    $("#ugAvatars").innerHTML = UG_AVATARS.map(function (a) {
      return '<button class="ug-av' + (a === ugSelAvatar ? ' sel' : '') + '" data-av="' + a + '">' + a + '</button>';
    }).join("");
    $$("#ugAvatars .ug-av").forEach(function (b) {
      b.onclick = function () { ugSelAvatar = b.dataset.av; $$("#ugAvatars .ug-av").forEach(function (x) { x.classList.toggle("sel", x === b); }); };
    });
    renderUserList();
    $("#ugCreate").onclick = function () {
      var name = $("#ugName").value.trim() || "小学员";
      GARDEN.createUser(name, ugSelAvatar);
      if (window.SND) SND.adopt();
      enterApp();
    };
  }
  function renderUserList() {
    var us = GARDEN.listUsers();
    $("#ugList").innerHTML = us.length ? us.map(function (u) {
      return '<div class="ug-user" data-uid="' + u.id + '"><span class="ugu-av">' + u.avatar + '</span>' +
        '<span style="flex:1"><span class="ugu-name">' + esc(u.name) + '</span><br><span class="ugu-meta">点击继续 TA 的学习进度</span></span>' +
        '<button class="ug-del" data-del="' + u.id + '" title="删除该用户">🗑️</button>' +
        '<span style="color:#ffb703">›</span></div>';
    }).join("") : '';
    $$("#ugList .ug-user").forEach(function (el) {
      el.onclick = function (e) {
        if (e.target.closest(".ug-del")) return;
        GARDEN.switchUser(el.dataset.uid); if (window.SND) SND.click(); enterApp();
      };
    });
    $$("#ugList .ug-del").forEach(function (b) {
      b.onclick = function (e) {
        e.stopPropagation();
        var u = GARDEN.listUsers().filter(function (x) { return x.id === b.dataset.del; })[0];
        if (!confirm("确定删除「" + (u ? u.name : "") + "」吗？TA 的积分和家园会被清空，无法恢复！")) return;
        GARDEN.deleteUser(b.dataset.del);
        toast("已删除");
        renderUserList();
      };
    });
  }
  function enterApp() {
    $("#userGate").classList.add("hidden");
    refreshUserBadge();
    var savedTab = null; try { savedTab = localStorage.getItem("snmath_tab"); } catch (e) {}
    if (savedTab && tabPages[savedTab] && savedTab !== "home") switchTab(savedTab); else switchTab("home");
  }
  function openUserGate() { renderUserList(); $("#userGate").classList.remove("hidden"); }
  function refreshUserBadge() {
    var u = GARDEN.activeUser();
    var btn = $("#btnUser");
    if (btn) { btn.textContent = u ? u.avatar : "🦊"; btn.title = u ? ("当前：" + u.name + "（点击切换）") : "选择用户"; }
  }

  /* ---------- 启动 ---------- */
  $("#verTag").textContent = "v" + MD.version;
  initSelectors();
  initUserGate();
  if (window.SCRATCH) SCRATCH.init();
  $("#btnUser").onclick = openUserGate;
  if (window.SND) { document.addEventListener("pointerdown", function once() { SND.unlock(); document.removeEventListener("pointerdown", once); }); }
  if (GARDEN.activeUser()) {
    enterApp(); /* 内部会恢复上次页签 */
  } else {
    $("#userGate").classList.remove("hidden");
  }
})();
</script>
</body></html>
